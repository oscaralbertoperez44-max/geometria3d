<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MathAR Ultra — Espacio Matemático Inmersivo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#030812;--panel:rgba(6,14,26,.85);--line:rgba(85,214,255,.25);--text:#eef6ff;--muted:#9db2c9;--accent:#55d6ff;--good:#65e6a3}
*{box-sizing:border-box}
body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,sans-serif}

/* Lienzo y video a pantalla completa */
#stage{position:absolute;inset:0;width:100%;height:100%;background:#02050b}
#camera{width:100%;height:100%;object-fit:cover;display:none;position:absolute;inset:0}
#webglCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:auto}

/* Panel de control flotante superior / lateral estilo HUD */
.hud-panel{position:absolute;top:16px;left:16px;width:340px;max-height:calc(100vh - 32px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;backdrop-filter:blur(16px);z-index:10;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.hud-header{display:flex;align-items:center;justify-content:between;margin-bottom:12px}
h1{font-size:18px;margin:0;display:flex;align-items:center;gap:8px}h1 span{color:var(--accent);font-size:11px;border:1px solid var(--line);padding:2px 6px;border-radius:6px}

label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
select,input,button{width:100%;min-height:40px;border:1px solid var(--line);border-radius:10px;background:#091424;color:var(--text);padding:8px 12px;font-size:13px}
button{cursor:pointer;font-weight:700;background:#0f253f;transition:all .2s}button:hover{background:#16355b;border-color:var(--accent)}
button.primary{background:var(--accent);color:#04111c;border-color:var(--accent)}button.primary:hover{background:#3fc5ed}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.math-card{margin-top:10px;background:rgba(2,6,12,.6);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;color:var(--muted);line-height:1.4}
.math-card b{color:var(--accent)}

.status{margin-top:10px;padding:8px 10px;border-radius:8px;background:rgba(2,6,12,.8);color:var(--muted);font-size:11px;border:1px solid var(--line)}

/* Badges flotantes inferiores */
.hud-footer{position:absolute;bottom:20px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:10}
.badge{background:rgba(6,14,26,.85);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:12px;backdrop-filter:blur(10px);pointer-events:auto}

@media(max-width:768px){
  .hud-panel{width:calc(100% - 32px);max-height:55vh;top:auto;bottom:16px;left:16px}
  .hud-footer{display:none}
}
</style>
</head>
<body>

<div id="stage">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="webglCanvas"></canvas>
</div>

<!-- Panel flotante principal (HUD) -->
<div class="hud-panel">
  <div class="hud-header">
    <h1>📐 MathAR <span>ULTRA</span></h1>
  </div>
  
  <label for="object">Modelo Matemático / Superficie</label>
  <select id="object">
    <option value="cube">Cubo (Geometría del Espacio)</option>
    <option value="sphere">Esfera (Superficie Esférica)</option>
    <option value="cylinder">Cilindro (Cuerpo de Revolución)</option>
    <option value="cone">Cono (Sección Cónica)</option>
    <option value="pyramid">Pirámide Regular</option>
    <option value="paraboloid">Paraboloide Elíptico ($z = x^2 + y^2$)</option>
    <option value="vectors">Vectores en ℝ³ ($\vec{u}, \vec{v}, \vec{w}$)</option>
  </select>

  <div class="math-card" id="mathCard">
    <b>Propiedades:</b><br><span id="mathDesc">Cuerpo poliédrico regular de 6 caras congruentes. Volumen = $a^3$.</span>
  </div>

  <label for="scale">Escala del Objeto</label>
  <input id="scale" type="range" min=".4" max="2.5" value="1" step=".1">

  <div class="row" style="margin-top:10px">
    <button id="cameraBtn" class="primary">📷 Activar Cámara</button>
    <button id="snapBtn">📸 Capturar HD</button>
  </div>
  <div class="row" style="margin-top:6px">
    <button id="rotateBtn">⏸ Pausar Giro</button>
    <button id="arBtn">🥽 WebXR AR</button>
  </div>

  <div id="status" class="status">Estado: Motor 3D activo a pantalla completa. Arrastra para rotar.</div>
</div>

<!-- Badges inferiores de estado -->
<div class="hud-footer">
  <span class="badge" id="mode">Modo: Entorno Inmersivo 3D</span>
  <span class="badge" id="objectName">Objeto: Cubo</span>
</div>

<script>
(() => {
const $=id=>document.getElementById(id);
const video=$('camera'), canvas=$('webglCanvas'), status=$('status'), objectSel=$('object'), scaleInput=$('scale');
let stream=null, autoRotate=true;

const mathInfo = {
  cube: "Cubo: 6 caras, 12 aristas, 8 vértices. Volumen = $a^3$, Área = $6a^2$.",
  sphere: "Esfera: Superficie equidistante. Volumen = $\\frac{4}{3}\\pi r^3$, Área = $4\\pi r^2$.",
  cylinder: "Cilindro: Revolución de rectángulo. Volumen = $\\pi r^2 h$.",
  cone: "Cono: Base circular y cúspide. Volumen = $\\frac{1}{3}\\pi r^2 h$.",
  pyramid: "Pirámide: Base poligonal y caras triangulares. Volumen = $\\frac{1}{3} A_b h$.",
  paraboloid: "Paraboloide Elíptico: Superficie cuádrica de revolución en ℝ³.",
  vectors: "Vectores en ℝ³: Tripleta ordenada $(x, y, z)$ con operaciones lineales."
};

// Three.js Setup a Pantalla Completa
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 4.5;

const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

// Luces profesionales
const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0x55d6ff, 1.4);
dirLight.position.set(6, 12, 8);
scene.add(dirLight);

let currentMesh = null;
const material = new THREE.MeshStandardMaterial({ color: 0x55d6ff, roughness: 0.25, metalness: 0.2, transparent: true, opacity: 0.88 });
const wireMaterial = new THREE.MeshBasicMaterial({ color: 0x65e6a3, wireframe: true });

function createObject(type) {
  if (currentMesh) scene.remove(currentMesh);
  
  let geom;
  if (type === 'cube') geom = new THREE.BoxGeometry(1.6, 1.6, 1.6);
  else if (type === 'sphere') geom = new THREE.SphereGeometry(1.1, 36, 36);
  else if (type === 'cylinder') geom = new THREE.CylinderGeometry(0.9, 0.9, 1.8, 36);
  else if (type === 'cone') geom = new THREE.ConeGeometry(1.1, 2, 36);
  else if (type === 'pyramid') geom = new THREE.ConeGeometry(1.3, 1.8, 4);
  else if (type === 'paraboloid') {
    geom = new THREE.ParametricGeometry((u, v, target) => {
      let x = (u - 0.5) * 2.8;
      let y = (v - 0.5) * 2.8;
      let z = (x*x + y*y) * 0.35 - 0.9;
      target.set(x, z, y);
    }, 30, 30);
  }
  else if (type === 'vectors') {
    const group = new THREE.Group();
    const origin = new THREE.Vector3(0,0,0);
    group.add(new THREE.ArrowHelper(new THREE.Vector3(1,0,0), origin, 1.8, 0xff5555, 0.3, 0.15));
    group.add(new THREE.ArrowHelper(new THREE.Vector3(0,1,0), origin, 1.8, 0x65e6a3, 0.3, 0.15));
    group.add(new THREE.ArrowHelper(new THREE.Vector3(0,0,1), origin, 1.8, 0x55d6ff, 0.3, 0.15));
    currentMesh = group;
    scene.add(currentMesh);
    return;
  }

  currentMesh = new THREE.Mesh(geom, material);
  const wireOverlay = new THREE.Mesh(geom, wireMaterial);
  currentMesh.add(wireOverlay);
  scene.add(currentMesh);
}

createObject('cube');

// Ajuste dinámico de ventana completa
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Control manual de órbita por gestos o mouse
let isDragging = false, prevPos = { x: 0, y: 0 };
window.addEventListener('pointerdown', e => { if(e.target.tagName !== 'SELECT' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') { isDragging = true; prevPos = { x: e.clientX, y: e.clientY }; } });
window.addEventListener('pointermove', e => {
  if (!isDragging || !currentMesh) return;
  currentMesh.rotation.y += (e.clientX - prevPos.x) * 0.01;
  currentMesh.rotation.x += (e.clientY - prevPos.y) * 0.01;
  prevPos = { x: e.clientX, y: e.clientY };
});
window.addEventListener('pointerup', () => { isDragging = false; });

// Loop de animación fluido
function animate() {
  requestAnimationFrame(animate);
  if (autoRotate && currentMesh && !isDragging) {
    currentMesh.rotation.y += 0.006;
    currentMesh.rotation.x += 0.002;
  }
  renderer.render(scene, camera);
}
animate();

// Eventos de interfaz
objectSel.addEventListener('change', () => {
  const val = objectSel.value;
  $('objectName').textContent = 'Objeto: ' + objectSel.options[objectSel.selectedIndex].text.split('(')[0].trim();
  $('mathDesc').innerHTML = mathInfo[val];
  createObject(val);
});

scaleInput.addEventListener('input', () => {
  if (currentMesh) {
    let s = Number(scaleInput.value);
    currentMesh.scale.set(s, s, s);
  }
});

$('rotateBtn').addEventListener('click', () => {
  autoRotate = !autoRotate;
  $('rotateBtn').textContent = autoRotate ? '⏸ Pausar Giro' : '▶ Reanudar Giro';
});

$('cameraBtn').addEventListener('click', async () => {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
    video.style.display = 'none';
    renderer.setClearColor(0x000000, 0);
    $('cameraBtn').textContent = '📷 Activar Cámara';
    $('mode').textContent = 'Modo: Entorno Inmersivo 3D';
    status.textContent = 'Cámara detenida. Entorno virtual activo.';
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    video.srcObject = stream;
    video.style.display = 'block';
    renderer.setClearColor(0x000000, 0);
    $('cameraBtn').textContent = '⏹ Detener Cámara';
    $('mode').textContent = 'Modo: Cámara AR Fullscreen';
    status.textContent = 'Cámara activa en pantalla completa.';
  } catch (e) {
    status.textContent = 'Error al abrir cámara. Verifica permisos o HTTPS.';
  }
});

$('snapBtn').addEventListener('click', () => {
  renderer.render(scene, camera);
  const link = document.createElement('a');
  link.download = 'mathar-ultra-hd.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  status.textContent = 'Captura HD guardada con éxito.';
});

$('arBtn').addEventListener('click', async () => {
  if (!navigator.xr) { status.textContent = 'WebXR no soportado en este navegador.'; return; }
  try {
    const supported = await navigator.xr.isSessionSupported('immersive-ar');
    if (!supported) { status.textContent = 'AR inmersiva no disponible en este dispositivo.'; return; }
    const session = await navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['local-floor'] });
    $('mode').textContent = 'Modo: WebXR Inmersivo';
    status.textContent = 'Sesión WebXR AR iniciada.';
    session.addEventListener('end', () => { $('mode').textContent = 'Modo: Entorno Inmersivo 3D'; status.textContent = 'Sesión AR finalizada.'; });
  } catch(e) { status.textContent = 'Error al iniciar WebXR.'; }
});
})();
</script>
</body>
</html>
