<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuaderno Universitario - Versión Ligera y Rápida</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --bg-color: #2c2c2c; --toolbar-bg: #1a1a1a; --text-color: #fff; --accent: #4caf50; --ui-bg:rgba(18,18,18,.94); --ui-border:rgba(255,255,255,.12); }
        body { margin: 0; padding: 0; background-color: var(--bg-color); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; overscroll-behavior:none; }
        
        /* Toolbar */
        #toolbar { position: sticky; top: 0; width: 100%; background: var(--toolbar-bg); padding: 8px 12px; display: flex; gap: 7px; justify-content: flex-start; align-items: center; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); overflow-x: auto; scrollbar-width: thin; backdrop-filter: blur(14px); }
        button, select, input[type="range"] { background: #333; color: white; border: 1px solid #555; padding: 7px 10px; border-radius: 5px; cursor: pointer; font-size: 13px; transition: all 0.2s; white-space: nowrap; }
        button:hover, select:hover { background: #444; border-color: var(--accent); }
        button.active { background: var(--accent); color: #000; font-weight: bold; border-color: var(--accent); }
        input[type="color"] { -webkit-appearance: none; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; background: transparent; padding: 0; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid #555; border-radius: 5px; }
        .tool-group { display: flex; align-items: center; gap: 6px; border-right: 1px solid #555; padding-right: 8px; flex-shrink: 0; }

        /* Cuaderno y Hojas */
        #notebook { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 22px 12px 70px; width: 95%; max-width: 1500px; }
        .page-container { position: relative; width: 100%; aspect-ratio: 1 / 1.414; background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border-radius: 4px; overflow: hidden; touch-action: auto; contain: layout paint; will-change: transform; }
        .bg-layer, .draw-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .bg-layer { z-index: 1; pointer-events: none; }
        .draw-layer { z-index: 2; cursor: crosshair; touch-action: none; }
        .line-preview-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 12; display: none; }

        /* Elementos Pegados */
        .pasted-element { position: absolute; z-index: 3; border: 2px dashed transparent; cursor: move; user-select: none; touch-action: none; will-change: left, top; }
        .pasted-element:hover { border-color: rgba(0, 120, 215, 0.5); }
        .pasted-element.active-element { box-shadow: 0 0 0 1px rgba(0,120,215,.15); border-color: #0078d7; }
        .pasted-image { display: block; width: 100%; height: 100%; pointer-events: none; }
        .resize-handle { position: absolute; bottom: -6px; right: -6px; width: 14px; height: 14px; background-color: #0078d7; border: 2px solid white; border-radius: 50%; cursor: nwse-resize; display: none; }
        .pasted-element.active-element .resize-handle { display: block; }
        .pasted-element .object-tools { position: absolute; top: 5px; right: 5px; display: none; gap: 4px; z-index: 8; pointer-events: auto; }
        .pasted-element.active-element .object-tools { display: flex; }
        .object-tools button { border: 0; background: rgba(15,23,42,.86); color: #fff; border-radius: 7px; width: 25px; height: 25px; padding: 0; font-size: 12px; cursor: pointer; }
        .pasted-element.pdf-background { z-index: 1 !important; }
        .pasted-element.pdf-locked { cursor: default !important; }
        .pasted-element.pdf-background .resize-handle, .pasted-element.pdf-locked .resize-handle, .pasted-element.pdf-background .object-tools, .pasted-element.pdf-locked .object-tools { display: none !important; }

        /* Panel Avanzado */
        .enhanced-panel { position: fixed; right: 14px; top: 65px; z-index: 500; width: min(330px, calc(100vw - 28px)); overflow: auto; padding: 12px; border: 1px solid var(--ui-border); border-radius: 14px; background: var(--ui-bg); box-shadow: 0 15px 45px rgba(0,0,0,.45); display: none; box-sizing: border-box; }
        .enhanced-panel.open { display: block; }
        .enhanced-panel h3 { margin: 2px 0 10px; font-size: 15px; }
        .ep-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
        .ep-grid button { padding: 8px 7px; border: 1px solid #444; background: #292929; border-radius: 8px; }
        #pageIndicator { position: fixed; left: 14px; bottom: 14px; z-index: 450; background: rgba(20,20,20,.82); padding: 7px 10px; border-radius: 999px; font-size: 12px; border: 1px solid rgba(255,255,255,.1); pointer-events: none; }
        #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 1000; background: #171717; color: #fff; border: 1px solid #444; border-radius: 10px; padding: 10px 14px; font-size: 13px; pointer-events: none; transition: .22s ease; box-shadow: 0 8px 25px rgba(0,0,0,.35); }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Gestor de Cuadernos */
        #nb-launcher { position: fixed; left: 16px; top: 118px; z-index: 5000; background: #111827; color: #fff; border: 1px solid #374151; border-radius: 14px; padding: 8px 11px; font-weight: 700; box-shadow: 0 8px 24px #0006; cursor: pointer; }
        #nb-drawer { position: fixed; inset: 58px auto 0 0; width: min(360px, 92vw); background: #111827; z-index: 4999; transform: translateX(-105%); transition: .25s ease; box-shadow: 12px 0 35px #0008; display: flex; flex-direction: column; }
        #nb-drawer.open { transform: translateX(0); }
        .nb-head, .nb-actions { padding: 12px; border-bottom: 1px solid #374151; }
        .nb-head h2 { margin: 0; font-size: 19px; }
        #nb-list { padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
        .nb-item { display: grid; grid-template-columns: 1fr auto; gap: 6px; background: #172033; border-radius: 12px; padding: 8px; border: 1px solid #374151; }
        .nb-item.active { border-color: #60a5fa; box-shadow: 0 0 0 1px #60a5fa33; }
        .nb-open { border: 0 !important; background: transparent !important; text-align: left; padding: 8px !important; }
        .nb-name { font-weight: 800; }
        #nb-overlay { display: none; position: fixed; inset: 58px 0 0 0; background: #0007; z-index: 4998; }
        #nb-overlay.open { display: block; }

        /* PDF Studio */
        #pdfStudio { position: fixed; z-index: 4800; top: 82px; right: 18px; width: min(760px, calc(100vw - 28px)); height: min(72vh, 680px); background: #111827; border: 1px solid #334155; border-radius: 15px; box-shadow: 0 18px 55px #0008; display: none; flex-direction: column; resize: both; overflow: hidden; }
        #pdfStudio.open { display: flex; }
        .pdf-head { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #0b1220; border-bottom: 1px solid #334155; cursor: move; user-select: none; }
        .pdf-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px; background: #172033; border-bottom: 1px solid #334155; }
        #pdfLibrary { display: flex; gap: 5px; flex-wrap: wrap; padding: 7px 9px; background: #0f172a; border-bottom: 1px solid #334155; max-height: 58px; overflow: auto; }
        .pdf-chip { border: 1px solid #334155; background: #172033; border-radius: 14px; padding: 5px 9px; font-size: 11px; cursor: pointer; }
        .pdf-chip.active { border-color: #60a5fa; background: #1d4ed833; }
        .pdf-view { position: relative; flex: 1; overflow: auto; background: #334155; padding: 16px; }
        .pdf-page-wrap { position: relative; margin: 0 auto 16px; background: #fff; box-shadow: 0 8px 28px #0006; display: block; }
        .pdf-crop-box { position: absolute; border: 2px dashed #22c55e; background: #22c55e18; display: none; pointer-events: none; z-index: 4; }
        #pdfCropHistory { display: none; gap: 5px; flex-wrap: wrap; padding: 7px 9px; background: #0f172a; border-bottom: 1px solid #334155; max-height: 62px; overflow: auto; }
        .pdf-history-chip { border: 1px solid #334155; background: #172033; border-radius: 12px; padding: 4px 8px; font-size: 10px; cursor: pointer; }

        /* Fullscreen modifications */
        :fullscreen #toolbar { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); width: auto; max-width: 96vw; opacity: .08; transition: opacity .2s; z-index: 9000; border-radius: 14px; }
        :fullscreen #toolbar:hover { opacity: 1; }
        :fullscreen #notebook { width: 98%; max-width: none; padding-top: 12px; }
    </style>
</head>
<body>

    <!-- BARRA DE HERRAMIENTAS PRINCIPAL -->
    <div id="toolbar">
        <div class="tool-group" style="border-right:none;">
            <button onclick="toggleEnhancedPanel()">🧰 Más herramientas</button>
            <button onclick="togglePdfStudio()">📄 PDFs</button>
        </div>
        <div class="tool-group">
            <button id="btnPen" class="active" onclick="setTool('pen')">✒️ Lapicera</button>
            <button id="btnPencil" onclick="setTool('pencil')">✏️ Lápiz</button>
            <button id="btnLine" onclick="setTool('line')">📏 Línea</button>
            <button id="btnEraser" onclick="setTool('eraser')">🧼 Goma</button>
        </div>
        <div class="tool-group">
            <input type="color" id="colorPicker" value="#000000" onchange="updateColor()" title="Color">
            <input type="range" id="strokeSize" min="1" max="20" value="2" onchange="updateSize()" title="Grosor">
        </div>
        <div class="tool-group">
            <select id="bgType" onchange="changeBackgroundAll()">
                <option value="rayada">Hoja Rayada</option>
                <option value="cuadriculada">Hoja Cuadriculada</option>
                <option value="blanca">Hoja Blanca</option>
            </select>
        </div>
        <div class="tool-group">
            <button onclick="addPage()">➕ Nueva Hoja</button>
            <button onclick="clearCurrentPage()">🗑️ Limpiar Hoja</button>
            <button onclick="document.getElementById('anyFileInput').click()">📎 Insertar</button>
            <input type="file" id="anyFileInput" style="display:none" multiple onchange="handleAnyFile(event)">
        </div>
        <div class="tool-group" style="border-right: none;">
            <button onclick="toggleFullScreen()">⛶ Pantalla Completa</button>
            <button onclick="saveLocalSilent()">💾 Guardar Rápido</button>
        </div>
    </div>

    <!-- PANEL AVANZADO / RESPALDOS -->
    <div id="enhancedPanel" class="enhanced-panel">
      <h3>🚀 Utilidades y Respaldos</h3>
      <div class="ep-grid">
        <button onclick="undoAction()">↶ Deshacer</button>
        <button onclick="redoAction()">↷ Rehacer</button>
        <button onclick="duplicatePage()">📑 Duplicar hoja</button>
        <button onclick="deleteCurrentPage()">🗑️ Borrar hoja</button>
        <button onclick="addTextBox()">🔤 Texto</button>
        <button onclick="toggleGridOverlay()">▦ Guía Visual</button>
        <button onclick="descargarRespaldo()" style="background:#0f766e; border-color:#0d9488;">📥 Descargar Backup (JSON)</button>
        <button onclick="cargarRespaldo()" style="background:#b45309; border-color:#d97706;">📤 Restaurar Backup (JSON)</button>
      </div>
    </div>

    <div id="pageIndicator">Hoja 0 / 0</div>
    <div id="toast"></div>

    <div id="notebook">
        <!-- Las hojas se generan aquí dinámicamente -->
    </div>

    <!-- GESTOR DE MATERIAS -->
    <button id="nb-launcher" onclick="toggleNotebookManager()">📚 Mis cuadernos</button>
    <div id="nb-overlay" onclick="toggleNotebookManager()"></div>
    <aside id="nb-drawer">
      <div class="nb-head"><div><h2>📚 Mis cuadernos</h2></div><button onclick="toggleNotebookManager()">✕</button></div>
      <div class="nb-actions"><button onclick="createNotebook()">➕ Nueva materia</button><button onclick="renameCurrentNotebook()">✏️ Renombrar</button></div>
      <div id="nb-list"></div>
    </aside>

    <!-- PDF STUDIO LIGERO -->
    <div id="pdfStudio">
      <div class="pdf-head" id="pdfDragHandle">
          <strong id="pdfTitle">📄 Lector y Recortes PDF</strong>
          <span style="flex:1"></span>
          <button onclick="pdfZoom(-1)">−</button><span id="pdfZoomLabel" style="font-size:12px; margin:0 5px;">100%</span><button onclick="pdfZoom(1)">+</button>
          <button onclick="togglePdfStudio()" style="margin-left:10px;">✕</button>
      </div>
      <div class="pdf-bar">
        <input id="pdfFileInput" type="file" accept="application/pdf" style="width:180px;">
        <button onclick="pdfPrevPage()">◀</button><span id="pdfPageLabel" style="font-size:11px; margin:0 5px;">Sin PDF</span><button onclick="pdfNextPage()">▶</button>
        <button id="pdfCropBtn" onclick="togglePdfCrop()" style="margin-left:auto;">✂️ Recortar</button>
        <button id="pdfPasteBtn" onclick="pastePdfCropToNotebook()">📋 Pegar en cuaderno</button>
      </div>
      <div id="pdfLibrary"><div style="padding:10px; font-size:12px; color:#94a3b8;">Cargá un PDF para visualizarlo aquí.</div></div>
      <div id="pdfCropHistory"></div>
      <div id="pdfView" class="pdf-view"><div style="padding:10px; font-size:12px; color:#94a3b8;">Abrí un PDF o cargá uno nuevo.</div></div>
    </div>

    <!-- SCRIPT PRINCIPAL -->
    <script>
        // ESTADO GLOBAL CORE
        let currentTool = 'pen'; 
        let strokeColor = '#000000';
        let strokeSize = 2;
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let pagesData = []; 
        let activePageContainer = null; 
        let activePastedElement = null;

        const notebookEl = document.getElementById('notebook');

        // Utils
        function toast(msg){
            const el = document.getElementById('toast'); if(!el) return;
            el.textContent = msg; el.classList.add('show');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => el.classList.remove('show'), 1700);
        }
        function toggleEnhancedPanel(){ document.getElementById('enhancedPanel')?.classList.toggle('open'); }
        function toggleFullScreen() {
            if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(()=>{}); } 
            else { if (document.exitFullscreen) document.exitFullscreen(); }
        }

        // INIT
        window.onload = () => {
            if (pagesData.length === 0) addPage();
        };

        // HERRAMIENTAS
        function setTool(tool) {
            currentTool = tool;
            ['btnPen','btnPencil','btnLine','btnEraser'].forEach(id => document.getElementById(id).classList.remove('active'));
            if(tool === 'pen') document.getElementById('btnPen').classList.add('active');
            if(tool === 'pencil') document.getElementById('btnPencil').classList.add('active');
            if(tool === 'line') document.getElementById('btnLine').classList.add('active');
            if(tool === 'eraser') document.getElementById('btnEraser').classList.add('active');
        }
        function updateSize() { strokeSize = document.getElementById('strokeSize').value; }
        function updateColor() { strokeColor = document.getElementById('colorPicker').value; }

        // GESTIÓN DE HOJAS
        function addPage(savedImgData = null, savedBg = null, savedElements = []) {
            snapshotState();
            const pageId = Date.now() + Math.random();
            const container = document.createElement('div');
            container.className = 'page-container';
            container.id = 'page-' + pageId;

            const bgCanvas = document.createElement('canvas'); bgCanvas.className = 'bg-layer';
            const drawCanvas = document.createElement('canvas'); drawCanvas.className = 'draw-layer';

            container.appendChild(bgCanvas); container.appendChild(drawCanvas);
            notebookEl.appendChild(container);

            container.addEventListener('pointerdown', () => { activePageContainer = container; updatePageIndicator(); });
            
            const pageObj = {
                id: pageId, container, bgCanvas, drawCanvas, bgCtx: bgCanvas.getContext('2d'), drawCtx: drawCanvas.getContext('2d'),
                _savedImgData: savedImgData || null, _dirtySave: !savedImgData, linePreview:null, linePreviewCtx:null
            };
            pagesData.push(pageObj); activePageContainer = container; 

            resizePageCanvases(pageObj);
            if (savedBg) document.getElementById('bgType').value = savedBg;
            drawBackground(pageObj);

            if (savedImgData) {
                const img = new Image();
                img.onload = () => {
                    pageObj.drawCtx.save(); pageObj.drawCtx.setTransform(1, 0, 0, 1, 0, 0);
                    pageObj.drawCtx.drawImage(img, 0, 0, pageObj.drawCanvas.width, pageObj.drawCanvas.height);
                    pageObj.drawCtx.restore();
                };
                img.src = savedImgData;
            }

            if (savedElements && savedElements.length > 0) {
                savedElements.forEach(elData => {
                    if(elData.type === 'text') addTextRestored(pageObj, elData);
                    else createPastedImage(elData.src, container, elData.x, elData.y, elData.w, elData.h, elData.locked, elData.background);
                });
            }
            setupDrawingEvents(pageObj); updatePageIndicator();
        }

        function resizePageCanvases(page) {
            const rect = page.container.getBoundingClientRect(); const scale = 2; 
            page.bgCanvas.width = Math.max(1, Math.round(rect.width * scale)); page.bgCanvas.height = Math.max(1, Math.round(rect.height * scale));
            page.drawCanvas.width = Math.max(1, Math.round(rect.width * scale)); page.drawCanvas.height = Math.max(1, Math.round(rect.height * scale));
            page.bgCtx.setTransform(scale, 0, 0, scale, 0, 0); page.drawCtx.setTransform(scale, 0, 0, scale, 0, 0);
        }

        function changeBackgroundAll() { pagesData.forEach(page => drawBackground(page)); scheduleAutosave(); }
        function drawBackground(page) {
            const ctx = page.bgCtx; const w = page.bgCanvas.width / 2; const h = page.bgCanvas.height / 2;
            const type = document.getElementById('bgType').value;
            ctx.clearRect(0, 0, w, h); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
            if (type === 'rayada') {
                ctx.strokeStyle = '#8bc34a'; ctx.lineWidth = 1;
                for (let y = 50; y < h; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)'; ctx.beginPath(); ctx.moveTo(60, 0); ctx.lineTo(60, h); ctx.stroke();
            } else if (type === 'cuadriculada') {
                ctx.strokeStyle = 'rgba(0, 150, 255, 0.3)'; ctx.lineWidth = 1.5; const step = 20;
                for (let x = 0; x < w; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
                for (let y = 0; y < h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(step*3, 0); ctx.lineTo(step*3, h); ctx.stroke();
            }
        }

        function clearCurrentPage() {
            snapshotState();
            if(!activePageContainer) return;
            const page = pagesData.find(p => p.container === activePageContainer);
            if(page) {
                page.drawCtx.clearRect(0, 0, page.drawCanvas.width, page.drawCanvas.height);
                activePageContainer.querySelectorAll('.pasted-element').forEach(el => el.remove());
                page._dirtySave = true; scheduleAutosave(); toast('Hoja limpiada');
            }
        }
        function duplicatePage(){
            const p=pagesData.find(x=>x.container===activePageContainer)||pagesData[pagesData.length-1]; if(!p)return;
            const els=[...p.container.querySelectorAll('.pasted-element')].map(el=>({ src:el.querySelector('img')?.src, text:!el.querySelector('img')?el.innerHTML:'', x:el.style.left, y:el.style.top, w:el.style.width, h:el.style.height, locked:el.classList.contains('pdf-locked'), background:el.classList.contains('pdf-background') }));
            addPage(p.drawCanvas.toDataURL(), document.getElementById('bgType').value, els); toast('Hoja duplicada');
        }
        function deleteCurrentPage(){
            if(pagesData.length>1){
                snapshotState();
                const idx = pagesData.findIndex(p => p.container === activePageContainer);
                if(idx > -1) { pagesData[idx].container.remove(); pagesData.splice(idx, 1); activePageContainer = pagesData[Math.max(0, idx-1)].container; updatePageIndicator(); scheduleAutosave(); toast('Hoja eliminada'); }
            } else if (confirm('¿Eliminar esta hoja y empezar de nuevo en blanco?')) {
                clearCurrentPage();
            }
        }
        function updatePageIndicator(){
            const ind=document.getElementById('pageIndicator'); if(!ind)return;
            const idx=Math.max(0,pagesData.findIndex(p=>p.container===activePageContainer))+1;
            ind.textContent=`Hoja ${pagesData.length?idx:0} / ${pagesData.length}`;
        }

        // DIBUJO
        let drawRectCache = null;
        function setupDrawingEvents(page) {
            const canvas = page.drawCanvas;
            canvas.addEventListener('pointerdown', (e) => { try{canvas.setPointerCapture(e.pointerId)}catch(_){} startDrawing(e, page); }, {passive:false});
            canvas.addEventListener('pointermove', (e) => draw(e, page), {passive:false});
            window.addEventListener('pointerup', stopDrawing, {passive:true});
            window.addEventListener('pointercancel', stopDrawing, {passive:true});
        }
        function getMousePos(canvas, e) { const rect = drawRectCache || canvas.getBoundingClientRect(); return { x: e.clientX - rect.left, y: e.clientY - rect.top }; }
        
        function ensureLinePreview(page){
            if(page.linePreview) return page.linePreview;
            const c=document.createElement('canvas'); c.className='line-preview-layer'; c.width=page.drawCanvas.width; c.height=page.drawCanvas.height;
            page.container.appendChild(c); page.linePreview=c; page.linePreviewCtx=c.getContext('2d'); return c;
        }
        function clearLinePreview(page){ if(page?.linePreviewCtx) page.linePreviewCtx.clearRect(0,0,page.linePreview.width,page.linePreview.height); if(page?.linePreview) page.linePreview.style.display='none'; }

        function startDrawing(e, page) {
            if(e.target.tagName.toLowerCase() === 'canvas') deselectPastedElements();
            activePageContainer=page.container; isDrawing = true;
            drawRectCache = page.drawCanvas.getBoundingClientRect();
            const pos = getMousePos(page.drawCanvas, e); lastX = pos.x; lastY = pos.y;
            const ctx = page.drawCtx; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            if (currentTool === 'line') {
                page.startX = pos.x; page.startY = pos.y;
                const preview=ensureLinePreview(page); preview.width=page.drawCanvas.width; preview.height=page.drawCanvas.height; preview.style.display='block';
                preview.style.left=page.drawCanvas.offsetLeft+'px'; preview.style.top=page.drawCanvas.offsetTop+'px'; preview.style.width=page.drawCanvas.clientWidth+'px'; preview.style.height=page.drawCanvas.clientHeight+'px';
                page.linePreviewCtx.setTransform(2,0,0,2,0,0); page.linePreviewCtx.clearRect(0,0,page.drawCanvas.clientWidth,page.drawCanvas.clientHeight);
            } else draw(e, page);
        }

        function draw(e, page) {
            if (!isDrawing) return;
            e.preventDefault(); const ctx = page.drawCtx; const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; const rect = drawRectCache;
            if (currentTool === 'line') {
                const ev = events[events.length - 1]; const pos = { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
                const pctx=page.linePreviewCtx; pctx.setTransform(2,0,0,2,0,0); pctx.clearRect(0,0,page.drawCanvas.clientWidth,page.drawCanvas.clientHeight);

        window.loadLibraryPdf = async (id) => { const rec=await dbGet(id); if(rec) await openPdfRecord(rec); };
        window.loadFile = async (f) => { if(!currentId)return; const bytes=await f.arrayBuffer(); const rec={id:'pdf_'+Date.now(),notebook:currentId,name:f.name,bytes}; await dbPut(rec); await openPdfRecord(rec); toast('📄 PDF guardado en la materia'); };
        
        document.getElementById('pdfFileInput').addEventListener('change', async e=>{ for(const f of e.target.files) if(f.type==='application/pdf') await window.loadFile(f); e.target.value=''; });
        window.pdfPrevPage=()=>pdfDoc&&renderPdfPage(pdfPage-1); window.pdfNextPage=()=>pdfDoc&&renderPdfPage(pdfPage+1);
        
        window.togglePdfCrop=function(){
            if(!pdfDoc){toast('Abrí un PDF primero');return} pdfCrop=!pdfCrop; pdfCropRect=null;
            document.getElementById('pdfCropBtn').textContent=pdfCrop?'✖️ Cancelar':'✂️ Recortar';
            if(!pdfCrop){const c=document.getElementById('pdfView').querySelector('.pdf-crop-box');if(c)c.style.display='none'}
        };
        window.pastePdfCropToNotebook=function(){
            if(!pdfDoc||!pdfCropRect||pdfCropRect.w<8){toast('Seleccioná un área del PDF primero');return}
            const wrap=document.getElementById('pdfView').querySelector('.pdf-page-wrap'),canvas=wrap?.querySelector('canvas'); if(!wrap||!canvas)return;
            const sx=canvas.width/wrap.getBoundingClientRect().width,sy=canvas.height/wrap.getBoundingClientRect().height;
            const sx0=Math.floor(pdfCropRect.x*sx),sy0=Math.floor(pdfCropRect.y*sy),sw=Math.ceil(pdfCropRect.w*sx),sh=Math.ceil(pdfCropRect.h*sy);
            const out=document.createElement('canvas');out.width=sw;out.height=sh;
            out.getContext('2d').drawImage(canvas,sx0,sy0,sw,sh,0,0,sw,sh);
            const src=out.toDataURL('image/png');
            let target = activePageContainer || pagesData[pagesData.length-1].container;
            createPastedImage(src,target,50,50,Math.min(target.clientWidth-40,sw));
            pdfCrop=false; document.getElementById('pdfCropBtn').textContent='✂️ Recortar'; wrap.querySelector('.pdf-crop-box').style.display='none'; toast('📋 Recorte pegado en hoja');
        };

        // Arrastre simple de PDF Studio
        const studio=document.getElementById('pdfStudio'), handle=document.getElementById('pdfDragHandle'); let pdfDrag=null;
        handle.addEventListener('pointerdown', e => { if(e.target.closest('button'))return; const r=studio.getBoundingClientRect(); pdfDrag={x:e.clientX-r.left,y:e.clientY-r.top}; handle.setPointerCapture?.(e.pointerId); });
        handle.addEventListener('pointermove', e => { if(!pdfDrag)return; studio.style.left=Math.max(0,e.clientX-pdfDrag.x)+'px'; studio.style.top=Math.max(0,e.clientY-pdfDrag.y)+'px'; studio.style.right='auto'; });
        handle.addEventListener('pointerup', () => pdfDrag=null);
        
        // Inicializar PDF.js worker
        import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs').then(mod=>{ window.__pdfjs=mod; mod.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs'; });
    </script>
</body>
</html>
