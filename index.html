<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Gráfico Three.js - Garantizado</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            pointer-events: none;
            letter-spacing: 1px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="info">MOTOR GRÁFICO ACTIVO - 60 FPS</div>

    <!-- Importación directa de Three.js mediante ESM oficial -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. Inicialización de Escena, Cámara y Renderizador
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Iluminación Avanzada
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x3b82f6, 50, 50);
        pointLight1.position.set(5, 5, 5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xec4899, 50, 50);
        pointLight2.position.set(-5, -5, 5);
        scene.add(pointLight2);

        // 3. Creación de Objetos Geométricos Complejos (Mesh con Material PBR)
        const geometry = new THREE.IcosahedronGeometry(2.5, 2);
        const material = new THREE.MeshPhysicalMaterial({
            color: 0x1e3a8a,
            metalness: 0.9,
            roughness: 0.1,
            wireframe: false,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Estructura anidada en órbita para mayor realismo visual
        const wireGeometry = new THREE.IcosahedronGeometry(3.0, 1);
        const wireMaterial = new THREE.MeshBasicMaterial({
            color: 0x60a5fa,
            wireframe: true,
            transparent: true,
            opacity: 0.3
        });
        const wireMesh = new THREE.Mesh(wireGeometry, wireMaterial);
        scene.add(wireMesh);

        // 4. Gestión del Redimensionamiento de Ventana
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 5. Bucle de Renderizado de Alto Rendimiento (Anidación por Frame)
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Rotaciones dinámicas complejas
            mesh.rotation.x = elapsedTime * 0.4;
            mesh.rotation.y = elapsedTime * 0.6;

            wireMesh.rotation.x = -elapsedTime * 0.3;
            wireMesh.rotation.y = -elapsedTime * 0.5;

            // Efecto de pulsación orgánica
            const scale = 1 + Math.sin(elapsedTime * 2) * 0.08;
            mesh.scale.set(scale, scale, scale);

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
