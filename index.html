<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MathAR Pro - Realidad Aumentada</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js, Controls, ARButton & Math.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/ARButton.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root { --glass-bg: rgba(9, 9, 11, 0.65); --glass-border: rgba(255, 255, 255, 0.08); }
        * { font-family: 'Inter', sans-serif; touch-action: none; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        .font-math { font-family: 'Fira Code', monospace; letter-spacing: -0.5px; }

        body { margin: 0; overflow: hidden; background-color: #000; }
        
        #canvas-container { position: absolute; inset: 0; z-index: 10; }
        #fallback-bg { background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #020617 100%); position: absolute; inset: 0; z-index: 5; transition: opacity 0.5s; }
        .grid-pattern { background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 30px 30px; width: 100%; height: 100%; }

        /* AR Button Customization */
        #ARButton { bottom: 120px !important; z-index: 50 !important; background-color: #6366f1 !important; border-radius: 12px !important; font-family: 'Inter', sans-serif !important; font-weight: bold !important; border: 1px solid rgba(255,255,255,0.2) !important; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.5) !important; padding: 12px 24px !important; }

        /* Glass UI */
        .panel-glass { background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid var(--glass-border); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .card-glass { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; }

        .ui-hidden { opacity: 0; pointer-events: none; transform: translateY(120%); }
        .modal-hidden { opacity: 0; pointer-events: none; transform: scale(0.95) translate(-50%, -50%); top: 50%; left: 50%; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #ffffff; cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; }
        
        .math-key { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #e4e4e7; font-family: 'Fira Code', monospace; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; padding: 12px 0; }
        .math-key:active { transform: scale(0.92); }
        .math-key.primary { background: rgba(99, 102, 241, 0.2); color: #818cf8; font-weight: bold; }
    </style>
</head>
<body class="text-zinc-100 select-none">

    <div id="fallback-bg"><div class="grid-pattern"></div></div>
    <div id="canvas-container"></div>

    <!-- UI Overlay (Encima de la cámara) -->
    <div id="ui-layer" class="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between p-4 overflow-hidden">
        
        <header class="flex justify-between items-start w-full pointer-events-auto">
            <div class="panel-glass px-4 py-3 rounded-2xl flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm tracking-wide text-white">MathAR Pro</h1>
                    <p class="text-[10px] text-emerald-400 font-medium uppercase tracking-widest"><i class="fa-solid fa-camera mr-1"></i>WebXR Ready</p>
                </div>
            </div>

            <div class="flex flex-col gap-2 items-end">
                <div class="flex gap-2 flex-wrap justify-end">
                    <button id="btn-equation" class="panel-glass hover:bg-indigo-500/20 text-indigo-300 w-10 h-10 rounded-2xl flex items-center justify-center transition-all border-indigo-500/30 shadow-[0_0_15px_rgba(99,102,241,0.3)]">
                        <i class="fa-solid fa-calculator"></i>
                    </button>
                    <button id="btn-axes" class="panel-glass hover:bg-emerald-500/20 text-emerald-400 w-10 h-10 rounded-2xl flex items-center justify-center transition-all border-emerald-500/30">
                        <i id="icon-axes" class="fa-solid fa-ruler-combined"></i>
                    </button>
                    <button id="btn-toggle-ui" class="panel-glass hover:bg-white/10 text-zinc-300 w-10 h-10 rounded-2xl flex items-center justify-center transition-all">
                        <i id="ui-eye-icon" class="fa-solid fa-eye-slash"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Paneles Inferiores -->
        <div id="ui-bottom-panels" class="w-full flex flex-col md:flex-row justify-between items-end gap-4 pointer-events-none transition-all duration-500">
            <!-- Selector y Parámetros -->
            <div class="panel-glass rounded-3xl w-full md:w-80 flex flex-col shadow-2xl pointer-events-auto overflow-hidden max-h-[45vh]">
                <div class="bg-black/20 border-b border-white/5 p-2 flex overflow-x-auto gap-2 hide-scrollbar" id="shape-selector-container"></div>
                <div class="p-4 overflow-y-auto space-y-4">
                    <div id="dynamic-controls" class="space-y-3"></div>
                    <div class="grid grid-cols-2 gap-2 mt-2">
                        <button id="btn-toggle-wireframe" class="card-glass text-xs py-2 text-zinc-300"><i class="fa-solid fa-border-all mr-1"></i> Malla</button>
                        <div class="card-glass py-2 flex justify-center relative cursor-pointer">
                            <input type="color" id="shape-color" value="#818cf8" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                            <div class="w-4 h-4 rounded-full bg-[#818cf8]" id="color-indicator"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Fórmulas -->
            <div class="panel-glass rounded-3xl w-full md:w-64 flex flex-col shadow-2xl pointer-events-auto p-4 max-h-[30vh] overflow-y-auto">
                <h2 class="text-xs font-bold text-indigo-300 mb-3 uppercase tracking-widest"><i class="fa-solid fa-function"></i> Análisis</h2>
                <div id="formula-display" class="space-y-2 text-[11px] font-math text-zinc-300"></div>
                <p id="educational-tip" class="text-[10px] text-zinc-400 mt-3 border-t border-white/10 pt-2"></p>
            </div>
        </div>
    </div>

    <!-- Teclado Ecuaciones (Modal) -->
    <div id="equation-modal" class="fixed z-50 panel-glass p-4 rounded-3xl w-[95%] max-w-md modal-hidden transition-all duration-300 pointer-events-auto border-indigo-500/30 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 shadow-2xl">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-sm font-bold text-white"><i class="fa-solid fa-square-root-variable text-indigo-400 mr-2"></i> Graficador z = f(x,y)</h2>
            <button id="btn-close-equation" class="text-zinc-400 w-8 h-8 rounded-full bg-white/5"><i class="fa-solid fa-times"></i></button>
        </div>
        
        <div class="card-glass p-3 mb-4 flex items-center gap-3 bg-black/40">
            <span class="font-math text-indigo-400 font-bold text-lg">z =</span>
            <input type="text" id="eq-input" readonly class="bg-transparent w-full outline-none text-white font-math text-lg" value="sin(x)*cos(y)">
        </div>

        <div class="grid grid-cols-5 gap-2 mb-2">
            <button class="math-key primary" onclick="typeEq('x')">x</button>
            <button class="math-key primary" onclick="typeEq('y')">y</button>
            <button class="math-key" onclick="typeEq('^')">^</button>
            <button class="math-key" onclick="typeEq('sqrt(')">√</button>
            <button class="math-key text-rose-400 bg-rose-500/10" onclick="typeEq('DEL')"><i class="fa-solid fa-delete-left"></i></button>
            
            <button class="math-key" onclick="typeEq('sin(')">sin</button>
            <button class="math-key" onclick="typeEq('cos(')">cos</button>
            <button class="math-key" onclick="typeEq('(')">(</button>
            <button class="math-key" onclick="typeEq(')')">)</button>
            <button class="math-key primary" onclick="typeEq('/')">÷</button>
            
            <button class="math-key bg-white/10" onclick="typeEq('7')">7</button>
            <button class="math-key bg-white/10" onclick="typeEq('8')">8</button>
            <button class="math-key bg-white/10" onclick="typeEq('9')">9</button>
            <button class="math-key" onclick="typeEq('pi')">π</button>
            <button class="math-key primary" onclick="typeEq('*')">×</button>
            
            <button class="math-key bg-white/10" onclick="typeEq('4')">4</button>
            <button class="math-key bg-white/10" onclick="typeEq('5')">5</button>
            <button class="math-key bg-white/10" onclick="typeEq('6')">6</button>
            <button class="math-key" onclick="typeEq('e')">e</button>
            <button class="math-key primary" onclick="typeEq('-')">-</button>
            
            <button class="math-key bg-white/10" onclick="typeEq('1')">1</button>
            <button class="math-key bg-white/10" onclick="typeEq('2')">2</button>
            <button class="math-key bg-white/10" onclick="typeEq('3')">3</button>
            <button class="math-key" onclick="typeEq('.')">.</button>
            <button class="math-key primary" onclick="typeEq('+')">+</button>

            <button class="math-key bg-white/10 col-span-2" onclick="typeEq('0')">0</button>
            <button class="math-key text-rose-400 bg-rose-500/10" onclick="typeEq('CLEAR')">AC</button>
            <button class="math-key bg-indigo-600 text-white font-bold col-span-2 shadow-lg shadow-indigo-500/30" onclick="executeGraph()">Graficar R³</button>
        </div>
    </div>

    <!-- Toast Notificación -->
    <div id="toast-notification" class="fixed top-20 left-1/2 -translate-x-1/2 z-[60] panel-glass px-4 py-2 rounded-full text-xs font-medium text-white flex items-center gap-2 opacity-0 transition-all duration-300 pointer-events-none">
        <i id="toast-icon" class="fa-solid fa-info-circle text-indigo-400"></i>
        <span id="toast-message">Notificación</span>
    </div>

    <script>
        // --- DATOS MATEMÁTICOS ---
        const SHAPES_DATA = {
            paraboloid: { name: 'Paraboloide', icon: 'fa-bowl-food', params: { a: 1, b: 1 }, sliders: [{ id: 'a', label: 'Eje X (a)', min: 0.5, max: 3, step: 0.1, val: 1 }, { id: 'b', label: 'Eje Y (b)', min: 0.5, max: 3, step: 0.1, val: 1 }], createGeometry: (p) => createParametric((u,v,t) => { const r = u * 2; const theta = v * Math.PI * 2; const x = r * Math.cos(theta) * p.a; const z = r * Math.sin(theta) * p.b; const y = (x*x)/(p.a*p.a) + (z*z)/(p.b*p.b); t.set(x, y - 2, z); }), formulas: { area: 'z = x²/a² + y²/b²', extra: 'Cuádrica en R³' }, tip: 'Superficie de revolución clásica. Mínimo absoluto en el origen.' },
            cube: { name: 'Cubo/Prisma', icon: 'fa-cube', params: { width: 1.5, height: 1.5, depth: 1.5 }, sliders: [ { id: 'width', label: 'X (a)', min: 0.5, max: 3, step: 0.1, val: 1.5 }, { id: 'height', label: 'Y (b)', min: 0.5, max: 3, step: 0.1, val: 1.5 }, { id: 'depth', label: 'Z (c)', min: 0.5, max: 3, step: 0.1, val: 1.5 } ], createGeometry: (p) => new THREE.BoxGeometry(p.width, p.height, p.depth), formulas: { area: 'A = 2(ab+ac+bc)', extra: 'V = a·b·c' }, tip: 'Volumen definido por integrales iteradas con límites constantes.' },
            sphere: { name: 'Esfera', icon: 'fa-globe', params: { radius: 1.2 }, sliders: [ { id: 'radius', label: 'Radio (r)', min: 0.5, max: 2, step: 0.1, val: 1.2 } ], createGeometry: (p) => new THREE.SphereGeometry(p.radius, 32, 32), formulas: { area: 'x² + y² + z² = r²', extra: 'V = ⁴⁄₃πr³' }, tip: 'Cambio a coordenadas esféricas: x=r·senφ·cosθ, y=r·senφ·senθ, z=r·cosφ' }
        };

        let currentShapeKey = 'paraboloid';
        let activeMaterialMode = 'both', currentColorHex = '#818cf8', uiVisible = true;
        let scene, camera, renderer, controls;
        let shapeGroup, axesGroup, containerGroup; 
        let isARMode = false;
        
        // Variables para rotación táctil en AR
        let previousTouch = null;
        let touchRotation = { x: 0, y: 0 };

        function createParametric(func, slices=40, stacks=40) {
            const geometry = new THREE.BufferGeometry();
            const indices = [], vertices = [];
            const p = new THREE.Vector3();
            for (let i = 0; i <= stacks; i++) {
                const v = i / stacks;
                for (let j = 0; j <= slices; j++) {
                    const u = j / slices;
                    func(u, v, p);
                    vertices.push(p.x, p.y, p.z);
                }
            }
            for (let i = 0; i < stacks; i++) {
                for (let j = 0; j < slices; j++) {
                    const a = i * (slices + 1) + (j + 1), b = i * (slices + 1) + j, c = (i + 1) * (slices + 1) + j, d = (i + 1) * (slices + 1) + (j + 1);
                    indices.push(a, b, d); indices.push(b, c, d);
                }
            }
            geometry.setIndex(indices); geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.computeVertexNormals(); return geometry;
        }

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(3, 3, 4);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true; // Habilitar WebXR
            container.appendChild(renderer.domElement);

            // Botón de AR nativo
            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

            // Contenedor principal que se moverá/rotará
            containerGroup = new THREE.Group();
            scene.add(containerGroup);

            // Grupo de la figura geométrica
            shapeGroup = new THREE.Group();
            containerGroup.add(shapeGroup);

            // Ejes 3D
            axesGroup = new THREE.Group();
            axesGroup.add(new THREE.AxesHelper(3));
            axesGroup.add(new THREE.GridHelper(6, 12, 0x888888, 0x444444));
            containerGroup.add(axesGroup);

            // Luces
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            // Controles de escritorio/móvil SIN AR
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Detectar entrada/salida de AR
            renderer.xr.addEventListener('sessionstart', () => { 
                isARMode = true; 
                document.getElementById('fallback-bg').style.opacity = '0';
                // En AR, la figura flota frente a la cámara
                containerGroup.position.set(0, 0, -2); 
                containerGroup.scale.set(0.3, 0.3, 0.3); // Más pequeño para AR
            });
            renderer.xr.addEventListener('sessionend', () => { 
                isARMode = false; 
                document.getElementById('fallback-bg').style.opacity = '1';
                containerGroup.position.set(0,0,0);
                containerGroup.scale.set(1, 1, 1);
                camera.position.set(3, 3, 4);
                controls.target.set(0,0,0);
            });

            // Gestos táctiles para rotar la figura EN MODO AR
            renderer.domElement.addEventListener('touchstart', (e) => {
                if(isARMode && e.touches.length === 1) { previousTouch = { x: e.touches[0].pageX, y: e.touches[0].pageY }; }
            });
            renderer.domElement.addEventListener('touchmove', (e) => {
                if(isARMode && e.touches.length === 1 && previousTouch) {
                    const deltaX = e.touches[0].pageX - previousTouch.x;
                    const deltaY = e.touches[0].pageY - previousTouch.y;
                    shapeGroup.rotation.y += deltaX * 0.01;
                    shapeGroup.rotation.x += deltaY * 0.01;
                    previousTouch = { x: e.touches[0].pageX, y: e.touches[0].pageY };
                }
            });
            renderer.domElement.addEventListener('touchend', () => { previousTouch = null; });

            window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

            updateShape();
            renderUI();
            
            renderer.setAnimationLoop(() => {
                if(!isARMode) controls.update(); // Solo rotar automático si NO estamos en AR
                else {
                    // Animación suave de flotación en AR
                    shapeGroup.position.y = Math.sin(Date.now() * 0.001) * 0.1;
                }
                renderer.render(scene, camera);
            });
        }

        function updateShape() {
            const data = SHAPES_DATA[currentShapeKey];
            while (shapeGroup.children.length) {
                const child = shapeGroup.children[0];
                if(child.geometry) child.geometry.dispose();
                if(child.material) child.material.dispose();
                shapeGroup.remove(child);
            }
            
            const geo = data.createGeometry(data.params);
            geo.center(); // Centrar siempre la geometría

            const mat = new THREE.MeshPhysicalMaterial({ color: currentColorHex, roughness: 0.3, metalness: 0.2, transparent: true, opacity: activeMaterialMode==='wireframe'?0.1:0.85, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(geo, mat);
            shapeGroup.add(mesh);

            if (activeMaterialMode !== 'solid') {
                const wireMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 });
                shapeGroup.add(new THREE.LineSegments(new THREE.WireframeGeometry(geo), wireMat));
            }

            document.getElementById('formula-display').innerHTML = `
                <div class="flex justify-between"><span class="text-zinc-500">Expresión</span><span class="text-emerald-300">${data.formulas.area}</span></div>
                <div class="flex justify-between"><span class="text-zinc-500">Atributo</span><span class="text-amber-300">${data.formulas.extra}</span></div>
            `;
            document.getElementById('educational-tip').textContent = data.tip;
        }

        function renderUI() {
            const cont = document.getElementById('shape-selector-container'); cont.innerHTML = '';
            Object.keys(SHAPES_DATA).forEach(k => {
                const btn = document.createElement('button');
                btn.className = `px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${k===currentShapeKey?'bg-indigo-500 text-white':'bg-white/5 text-zinc-400'}`;
                btn.innerHTML = `<i class="fa-solid ${SHAPES_DATA[k].icon} mr-1"></i> ${SHAPES_DATA[k].name}`;
                btn.onclick = () => { currentShapeKey = k; renderUI(); updateShape(); };
                cont.appendChild(btn);
            });

            const dyn = document.getElementById('dynamic-controls'); dyn.innerHTML = '';
            SHAPES_DATA[currentShapeKey].sliders.forEach(s => {
                const div = document.createElement('div');
                div.innerHTML = `<div class="flex justify-between text-[11px] mb-1"><span class="text-zinc-300">${s.label}</span><span id="v-${s.id}" class="text-indigo-400 font-math">${SHAPES_DATA[currentShapeKey].params[s.id].toFixed(1)}</span></div>
                <input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${SHAPES_DATA[currentShapeKey].params[s.id]}">`;
                dyn.appendChild(div);
                div.querySelector('input').addEventListener('input', (e) => {
                    SHAPES_DATA[currentShapeKey].params[s.id] = parseFloat(e.target.value);
                    document.getElementById(`v-${s.id}`).textContent = SHAPES_DATA[currentShapeKey].params[s.id].toFixed(1);
                    updateShape();
                });
            });
        }

        // --- SISTEMA DE ECUACIONES ---
        const eqInput = document.getElementById('eq-input');
        window.typeEq = (val) => {
            if(val === 'CLEAR') eqInput.value = '';
            else if(val === 'DEL') eqInput.value = eqInput.value.slice(0, -1);
            else eqInput.value += val;
        };

        window.executeGraph = () => {
            const expr = eqInput.value;
            try {
                const compiled = math.compile(expr);
                const k = 'eq_' + Date.now();
                SHAPES_DATA[k] = {
                    name: `z=${expr.substring(0,6)}...`, icon: 'fa-wave-square', params: { s: 5 },
                    sliders: [{ id: 's', label: 'Dominio', min: 2, max: 10, step: 1, val: 5 }],
                    createGeometry: (p) => createParametric((u,v,t) => {
                        const x = (u - 0.5) * p.s; const y = (v - 0.5) * p.s;
                        let z = 0; try { z = compiled.evaluate({x,y}); if(isNaN(z)) z=0; } catch(e){}
                        t.set(x, z, -y); // ThreeJS coords
                    }, 40, 40),
                    formulas: { area: `z = ${expr}`, extra: 'Superficie Paramétrica' }, tip: 'Gráfica generada en tiempo real. Utiliza el botón inferior AR para visualizarla en tu entorno.'
                };
                currentShapeKey = k; renderUI(); updateShape();
                document.getElementById('equation-modal').classList.add('modal-hidden');
                toast('Función compilada. Abre AR para verla en tu mundo.');
            } catch (e) { toast('Error matemático en la expresión'); }
        };

        function toast(msg) {
            const t = document.getElementById('toast-notification');
            document.getElementById('toast-message').textContent = msg;
            t.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => t.classList.add('opacity-0', 'pointer-events-none'), 3000);
        }

        window.onload = () => {
            init();
            document.getElementById('btn-equation').onclick = () => document.getElementById('equation-modal').classList.remove('modal-hidden');
            document.getElementById('btn-close-equation').onclick = () => document.getElementById('equation-modal').classList.add('modal-hidden');
            document.getElementById('btn-toggle-ui').onclick = () => {
                uiVisible = !uiVisible;
                document.getElementById('ui-bottom-panels').classList.toggle('ui-hidden');
                document.getElementById('ui-eye-icon').className = uiVisible ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
            };
            document.getElementById('shape-color').oninput = (e) => { currentColorHex = e.target.value; document.getElementById('color-indicator').style.backgroundColor = currentColorHex; updateShape(); };
            document.getElementById('btn-toggle-wireframe').onclick = () => { activeMaterialMode = activeMaterialMode === 'both' ? 'solid' : (activeMaterialMode === 'solid' ? 'wireframe' : 'both'); updateShape(); };
            
            // Ejes 2D/3D (Ahora rotando la cámara o ocultando ejes)
            let axesState = 1;
            document.getElementById('btn-axes').onclick = () => {
                axesState = (axesState + 1) % 3;
                if(axesState === 1) { // 3D
                    axesGroup.visible = true; 
                    controls.minPolarAngle = 0; controls.maxPolarAngle = Math.PI; controls.enableRotate = true;
                    toast('Modo R³ Activado');
                } else if(axesState === 2) { // 2D (Cenital)
                    axesGroup.visible = true;
                    camera.position.set(0, 10, 0); camera.lookAt(0,0,0);
                    controls.minPolarAngle = 0; controls.maxPolarAngle = 0; controls.enableRotate = false;
                    toast('Vista 2D (Plano XY)');
                } else { // Oculto
                    axesGroup.visible = false; controls.enableRotate = true;
                    toast('Ejes ocultos');
                }
            };
        };
    </script>
</body>
</html>
