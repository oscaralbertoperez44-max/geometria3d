<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cuaderno Universitario - Rendimiento Máximo</title>
    <style>
        :root { --bg-color: #1e1e1e; --toolbar-bg: #121212; --text-color: #fff; --accent: #4caf50; --ui-border: rgba(255,255,255,0.1); }
        body { margin: 0; padding: 0; background-color: var(--bg-color); font-family: 'Segoe UI', Tahoma, sans-serif; color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; overscroll-behavior: none; }
        
        /* Barra de Herramientas */
        #toolbar { position: sticky; top: 0; width: 100%; background: var(--toolbar-bg); padding: 8px 12px; display: flex; gap: 8px; justify-content: flex-start; align-items: center; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.6); overflow-x: auto; scrollbar-width: none; }
        #toolbar::-webkit-scrollbar { display: none; }
        button, select, input[type="range"] { background: #2a2a2a; color: white; border: 1px solid #444; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; white-space: nowrap; outline: none; }
        button:hover, select:hover { background: #3a3a3a; border-color: var(--accent); }
        button.active { background: var(--accent); color: #000; font-weight: 700; border-color: var(--accent); }
        input[type="color"] { -webkit-appearance: none; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; background: transparent; padding: 0; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid #555; border-radius: 50%; }
        .tool-group { display: flex; align-items: center; gap: 6px; border-right: 1px solid #444; padding-right: 10px; flex-shrink: 0; }

        /* Contenedor del Cuaderno */
        #notebook { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 12px 80px; width: 96%; max-width: 1400px; }
        
        /* Estructura de la Hoja Optimizada */
        .page-container { position: relative; width: 100%; aspect-ratio: 1 / 1.414; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 6px; overflow: hidden; contain: strict; content-visibility: auto; contain-intrinsic-size: 1000px 1414px; transform: translateZ(0); }
        .bg-layer, .draw-layer, .line-preview-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: top left; }
        .bg-layer { z-index: 1; pointer-events: none; }
        .draw-layer { z-index: 2; cursor: crosshair; touch-action: none; } 
        .line-preview-layer { z-index: 12; pointer-events: none; display: none; }

        /* Elementos Pegados (Imágenes / PDFs) */
        .pasted-element { position: absolute; z-index: 3; border: 2px dashed transparent; cursor: move; user-select: none; touch-action: none; }
        .pasted-element.dragging { will-change: transform; }
        .pasted-element.active-element { box-shadow: 0 0 0 2px rgba(0,120,215,.3); border-color: #0078d7; }
        .pasted-image { display: block; width: 100%; height: 100%; pointer-events: none; }
        .resize-handle { position: absolute; bottom: -8px; right: -8px; width: 16px; height: 16px; background-color: #0078d7; border: 2px solid white; border-radius: 50%; cursor: nwse-resize; display: none; }
        .pasted-element.active-element .resize-handle { display: block; }
        
        /* Controles de Objeto Pegado */
        .object-tools { position: absolute; top: 5px; right: 5px; display: none; gap: 4px; z-index: 8; pointer-events: auto; }
        .pasted-element.active-element .object-tools { display: flex; }
        .object-tools button { border: 0; background: rgba(15,23,42,.9); color: #fff; border-radius: 6px; width: 28px; height: 28px; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .object-tools button:hover { background: #2563eb; }
        .object-tools button.btn-delete:hover { background: #ef4444; }
        .pasted-element.pdf-background { z-index: 1 !important; }
        .pasted-element.pdf-locked { cursor: default !important; }
        .pasted-element.pdf-background .resize-handle, .pasted-element.pdf-locked .resize-handle, .pasted-element.pdf-background .object-tools { display: none !important; }
        .pasted-element.pdf-locked.active-element .object-tools { display: flex; }

        /* UI Flotante */
        #pageIndicator { position: fixed; left: 16px; bottom: 16px; z-index: 450; background: rgba(15,15,15,.9); padding: 8px 12px; border-radius: 8px; font-size: 13px; border: 1px solid var(--ui-border); font-weight: bold; pointer-events: none; }
        #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 9999; background: #222; color: #fff; border: 1px solid #555; border-radius: 8px; padding: 10px 16px; font-size: 14px; pointer-events: none; transition: .2s ease-out; box-shadow: 0 8px 25px rgba(0,0,0,.5); }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Gestor de Materias */
        #nb-launcher { position: fixed; left: 16px; top: 70px; z-index: 5000; background: #1a202c; color: #fff; border: 1px solid #4a5568; border-radius: 8px; padding: 10px 14px; font-weight: bold; box-shadow: 0 6px 20px rgba(0,0,0,0.6); cursor: pointer; }
        #nb-drawer { position: fixed; inset: 0 auto 0 0; width: min(340px, 90vw); background: #1a202c; z-index: 5001; transform: translateX(-105%); transition: transform .3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 12px 0 40px rgba(0,0,0,0.7); display: flex; flex-direction: column; }
        #nb-drawer.open { transform: translateX(0); }
        .nb-head, .nb-actions { padding: 16px; border-bottom: 1px solid #2d3748; }
        .nb-head { display: flex; justify-content: space-between; align-items: center; }
        .nb-head h2 { margin: 0; font-size: 18px; }
        .nb-head button { background: transparent; border: none; font-size: 18px; }
        #nb-list { padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
        .nb-item { display: flex; align-items: center; background: #2d3748; border-radius: 8px; padding: 10px; border: 1px solid #4a5568; cursor: pointer; }
        .nb-item:hover { background: #3a4759; }
        .nb-item.active { border-color: #63b3ed; background: rgba(99,179,237,0.15); }
        .nb-name { font-weight: bold; flex: 1; }
        #nb-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 4998; backdrop-filter: blur(2px); }
        #nb-overlay.open { display: block; }

        /* PDF Studio */
        #pdfStudio { position: fixed; z-index: 4800; top: 70px; right: 16px; width: min(720px, calc(100vw - 32px)); height: min(70vh, 600px); background: #1e293b; border: 1px solid #334155; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); display: none; flex-direction: column; resize: both; overflow: hidden; }
        #pdfStudio.open { display: flex; }
        .pdf-head { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #0f172a; border-bottom: 1px solid #334155; cursor: move; user-select: none; }
        .pdf-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px; background: #1e293b; border-bottom: 1px solid #334155; }
        .pdf-search-box { display: flex; flex: 1; min-width: 220px; background: #0f172a; border: 1px solid #475569; border-radius: 20px; overflow: hidden; }
        .pdf-search-box input { flex: 1; background: transparent; border: none; color: #fff; padding: 6px 12px; outline: none; font-size: 13px; }
        .pdf-search-box button { background: #2563eb; border: none; color: #fff; padding: 6px 14px; border-radius: 0 20px 20px 0; cursor: pointer; font-weight: bold; }
        .pdf-search-box button:hover { background: #1d4ed8; }
        #pdfLibrary { display: flex; gap: 6px; padding: 10px; background: #0f172a; border-bottom: 1px solid #334155; overflow-x: auto; scrollbar-width: none; }
        .pdf-chip { border: 1px solid #475569; background: #1e293b; border-radius: 20px; padding: 6px 12px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .pdf-chip.active { border-color: #3b82f6; background: rgba(59,130,246,0.2); }
        .pdf-view { position: relative; flex: 1; overflow: auto; background: #334155; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .pdf-page-wrap { position: relative; background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,0.6); display: inline-block; }
        .pdf-crop-box { position: absolute; border: 2px dashed #22c55e; background: rgba(34,197,94,0.15); display: none; pointer-events: none; z-index: 4; }

        /* Fullscreen modifications */
        :fullscreen #toolbar { position: fixed; top: 0; left: 0; width: 100%; opacity: 0; transition: opacity 0.3s; z-index: 9000; }
        :fullscreen #toolbar:hover { opacity: 1; }
        :fullscreen #notebook { width: 100%; max-width: none; padding-top: 20px; }
        :fullscreen #nb-launcher { display: none; }
    </style>
</head>
<body>

    <!-- BARRA DE HERRAMIENTAS -->
    <div id="toolbar">
        <div class="tool-group" style="border-right:none;">
            <button onclick="togglePdfStudio()">📄 PDF Studio & Buscador</button>
        </div>
        <div class="tool-group">
            <button id="btnPen" class="active" onclick="setTool('pen')">✒️ Lapicera</button>
            <button id="btnPencil" onclick="setTool('pencil')">✏️ Lápiz</button>
            <button id="btnLine" onclick="setTool('line')">📏 Línea recta</button>
            <button id="btnEraser" onclick="setTool('eraser')">🧼 Goma</button>
        </div>
        <div class="tool-group">
            <input type="color" id="colorPicker" value="#000000" onchange="updateColor()" title="Color del trazo">
            <label style="font-size:12px; margin-left:4px;">Grosor:</label>
            <input type="range" id="strokeSize" min="1" max="25" value="3" onchange="updateSize()" style="width: 80px;">
        </div>
        <div class="tool-group">
            <select id="bgType" onchange="changeBackgroundAll()">
                <option value="rayada">Hoja Rayada</option>
                <option value="cuadriculada">Hoja Cuadriculada</option>
                <option value="blanca">Hoja Blanca</option>
            </select>
        </div>
        <div class="tool-group">
            <button onclick="addPage()">➕ Nueva Hoja</button>
            <button onclick="duplicatePage()">📑 Duplicar</button>
            <button onclick="clearCurrentPage()" style="color:#ff6b6b;">🗑️ Limpiar</button>
            <button onclick="document.getElementById('anyFileInput').click()">📎 Insertar Archivo/Imagen</button>
            <input type="file" id="anyFileInput" style="display:none" multiple onchange="handleAnyFile(event)">
        </div>
        <div class="tool-group" style="border-right: none;">
            <button onclick="toggleFullScreen()">⛶ Pantalla Completa</button>
            <button onclick="descargarRespaldo()" style="background:#0f766e; border-color:#0d9488;">📥 Guardar Backup</button>
            <button onclick="cargarRespaldo()" style="background:#b45309; border-color:#d97706;">📤 Restaurar Backup</button>
        </div>
    </div>

    <div id="pageIndicator">Hoja 0 / 0</div>
    <div id="toast"></div>

    <div id="notebook">
        <!-- Las hojas se generan dinámicamente -->
    </div>

    <!-- GESTOR DE MATERIAS -->
    <button id="nb-launcher" onclick="toggleNotebookManager()">📚 Mis Cuadernos</button>
    <div id="nb-overlay" onclick="toggleNotebookManager()"></div>
    <aside id="nb-drawer">
      <div class="nb-head"><h2>📚 Mis Cuadernos</h2><button onclick="toggleNotebookManager()">✕</button></div>
      <div class="nb-actions" style="display:flex; gap:10px;">
          <button onclick="createNotebook()" style="flex:1;">➕ Nueva Materia</button>
          <button onclick="renameCurrentNotebook()" style="flex:1;">✏️ Renombrar</button>
      </div>
      <div id="nb-list"></div>
    </aside>

    <!-- PDF STUDIO Y BUSCADOR -->
    <div id="pdfStudio">
      <div class="pdf-head" id="pdfDragHandle">
          <strong id="pdfTitle">📄 PDF Studio Universitario</strong><span style="flex:1"></span>
          <button onclick="pdfZoom(-1)">−</button><span id="pdfZoomLabel" style="font-size:12px; margin:0 5px;">100%</span><button onclick="pdfZoom(1)">+</button>
          <button onclick="togglePdfStudio()" style="margin-left:10px; background:transparent; border:none; font-size:16px;">✕</button>
      </div>
      
      <!-- NUEVA BARRA DE BÚSQUEDA DE PDFs EN GOOGLE -->
      <div class="pdf-bar" style="background: #0f172a; padding-bottom: 5px;">
          <div class="pdf-search-box">
              <input id="pdfGoogleSearchInput" type="text" placeholder="🔍 Buscar documentos o libros en PDF por todo internet..." onkeydown="if(event.key==='Enter') searchGooglePDF()">
              <button onclick="searchGooglePDF()">Buscar PDF</button>
          </div>
      </div>

      <div class="pdf-bar">
        <input id="pdfFileInput" type="file" accept="application/pdf" style="width:160px; font-size:11px;">
        <button onclick="pdfPrevPage()">◀</button><span id="pdfPageLabel" style="font-size:12px; font-weight:bold; margin:0 5px;">Sin PDF</span><button onclick="pdfNextPage()">▶</button>
        <button id="pdfCropBtn" onclick="togglePdfCrop()" style="margin-left:auto; background:#2563eb; border-color:#3b82f6;">✂️ Recortar Área</button>
        <button id="pdfPasteBtn" onclick="pastePdfCropToNotebook()" style="background:#059669; border-color:#10b981;">📋 Pegar Recorte</button>
      </div>
      <div id="pdfLibrary"><div style="font-size:12px; color:#94a3b8;">Sube un PDF para verlo aquí.</div></div>
      <div id="pdfView" class="pdf-view"><div style="font-size:13px; color:#94a3b8;">Selecciona un PDF de la lista, busca en internet o carga uno nuevo.</div></div>
    </div>

    <!-- SCRIPT PRINCIPAL: MOTOR GRÁFICO OPTIMIZADO -->
    <script>
        // ================= MOTOR PRINCIPAL ROBUSTO / OPTIMIZADO =================
        'use strict';

        // ---------- ESTADO GLOBAL CONTROLADO ----------
        let currentTool = 'pen';
        let strokeColor = '#000000';
        let strokeSize = 3;
        let isDrawing = false;
        let activeDrawingPointerId = null;
        let lastX = 0, lastY = 0;
        let pagesData = [];
        let activePageContainer = null;
        let activePastedElement = null;
        let drawRectCache = null;
        const notebookEl = document.getElementById('notebook');
        const MAX_PIXEL_RATIO = (navigator.deviceMemory && navigator.deviceMemory <= 4) ? 1.5 : 2;
        const PIXEL_RATIO = Math.max(1, Math.min(window.devicePixelRatio || 1, MAX_PIXEL_RATIO));

        const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
        const nextFrame = () => new Promise(resolve => requestAnimationFrame(resolve));

        function toast(msg, ms = 1700){
            const el = document.getElementById('toast');
            if(!el) return;
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => el.classList.remove('show'), ms);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => toast('No se pudo activar pantalla completa'));
            else document.exitFullscreen?.();
        }

        function setTool(tool) {
            currentTool = tool;
            ['btnPen','btnPencil','btnLine','btnEraser'].forEach(id => document.getElementById(id)?.classList.remove('active'));
            document.getElementById('btn' + tool.charAt(0).toUpperCase() + tool.slice(1))?.classList.add('active');
        }
        function updateSize() { strokeSize = parseFloat(document.getElementById('strokeSize').value) || 3; }
        function updateColor() { strokeColor = document.getElementById('colorPicker').value || '#000000'; }

        // ---------- HELPERS DE CANVAS / BLOB ----------
        function canvasToBlob(canvas, type = 'image/webp', quality = 0.82){
            return new Promise((resolve, reject) => {
                try {
                    if (canvas.toBlob) {
                        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('No se pudo serializar el lienzo')), type, quality);
                    } else {
                        fetch(canvas.toDataURL(type, quality)).then(r => r.blob()).then(resolve, reject);
                    }
                } catch (err) { reject(err); }
            });
        }

        async function sourceToBlob(source){
            if (!source) return null;
            if (source instanceof Blob) return source;
            if (source instanceof ArrayBuffer) return new Blob([source]);
            if (ArrayBuffer.isView(source)) return new Blob([source.buffer]);
            if (typeof source === 'string') {
                const r = await fetch(source);
                if (!r.ok && !source.startsWith('data:') && !source.startsWith('blob:')) throw new Error('No se pudo leer la imagen');
                return r.blob();
            }
            return null;
        }

        function sourceToImageUrl(source){
            if (source instanceof Blob) return {url: URL.createObjectURL(source), revoke: true};
            return {url: source || '', revoke: false};
        }

        function blobToDataURL(blob){
            return new Promise((resolve, reject) => {
                const fr = new FileReader();
                fr.onload = () => resolve(fr.result);
                fr.onerror = () => reject(fr.error || new Error('Error leyendo Blob'));
                fr.readAsDataURL(blob);
            });
        }

        function dataURLToBlob(dataURL){
            const [head, body] = String(dataURL).split(',');
            const mime = /data:([^;]+)/.exec(head)?.[1] || 'application/octet-stream';
            const binary = head.includes(';base64') ? atob(body || '') : decodeURIComponent(body || '');
            const bytes = new Uint8Array(binary.length);
            for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
            return new Blob([bytes], {type:mime});
        }

        function arrayBufferToBase64(buffer){
            const bytes = new Uint8Array(buffer);
            let binary = '';
            const chunk = 0x8000;
            for(let i=0;i<bytes.length;i+=chunk) binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
            return btoa(binary);
        }
        function base64ToArrayBuffer(base64){
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
            return bytes.buffer;
        }

        // ================= GESTIÓN DE HOJAS =================
        const pageResizeObserver = new ResizeObserver(entries => {
            for (const entry of entries) {
                const page = pagesData.find(p => p.container === entry.target);
                if (!page || page._resizeRaf) continue;
                page._resizeRaf = requestAnimationFrame(() => {
                    page._resizeRaf = 0;
                    const r = page.container.getBoundingClientRect();
                    const targetW = Math.round(r.width * PIXEL_RATIO);
                    const targetH = Math.round(r.height * PIXEL_RATIO);
                    if (Math.abs(page.drawCanvas.width - targetW) > 1 || Math.abs(page.drawCanvas.height - targetH) > 1) {
                        resizePageCanvases(page);
                        drawBackground(page);
                    }
                });
            }
        });

        function elementBoxFromSaved(data, container){
            const cw = Math.max(1, container.clientWidth);
            const ch = Math.max(1, container.clientHeight);
            if (Number.isFinite(data?.xRatio) && Number.isFinite(data?.yRatio) && Number.isFinite(data?.wRatio)) {
                return {
                    x: data.xRatio * cw,
                    y: data.yRatio * ch,
                    w: data.wRatio * cw,
                    h: Number.isFinite(data.hRatio) ? data.hRatio * ch : null
                };
            }
            const parseDim = (v, total, fallback = 0) => {
                if (typeof v === 'number' && Number.isFinite(v)) return v;
                if (typeof v === 'string' && v.trim().endsWith('%')) return (parseFloat(v) || 0) * total / 100;
                const n = parseFloat(v);
                return Number.isFinite(n) ? n : fallback;
            };
            return {
                x: parseDim(data?.x, cw, 10),
                y: parseDim(data?.y, ch, 10),
                w: parseDim(data?.w, cw, Math.min(300, cw - 20)),
                h: data?.h ? parseDim(data.h, ch, null) : null
            };
        }

        async function addPage(savedDrawing = null, savedBg = null, savedElements = []) {
            const pageId = `${Date.now()}_${Math.random().toString(36).slice(2)}`;
            const container = document.createElement('div');
            container.className = 'page-container';
            container.id = 'page-' + pageId;

            const bgCanvas = document.createElement('canvas'); bgCanvas.className = 'bg-layer';
            const drawCanvas = document.createElement('canvas'); drawCanvas.className = 'draw-layer';
            container.append(bgCanvas, drawCanvas);
            notebookEl.appendChild(container);

            container.addEventListener('pointerdown', () => { activePageContainer = container; updatePageIndicator(); });

            const drawCtx = drawCanvas.getContext('2d');
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';

            const pageObj = {
                id: pageId,
                container, bgCanvas, drawCanvas,
                bgCtx: bgCanvas.getContext('2d', {alpha:false}),
                drawCtx,
                _savedDrawing: savedDrawing || null,
                _canvasDirty: !savedDrawing,
                _elementsDirty: Array.isArray(savedElements) ? savedElements.some(el => !Number.isFinite(el?.xRatio) || !('source' in el)) : true,
                _savedElements: Array.isArray(savedElements) ? savedElements : [],
                _resizeRaf: 0,
                linePreview: null,
                linePreviewCtx: null
            };

            pagesData.push(pageObj);
            activePageContainer = container;
            resizePageCanvases(pageObj);
            if (savedBg) document.getElementById('bgType').value = savedBg;
            drawBackground(pageObj);
            pageResizeObserver.observe(container);

            if (savedDrawing) {
                await drawSavedImageToCanvas(pageObj, savedDrawing);
                pageObj._canvasDirty = false;
            }

            if (Array.isArray(savedElements)) {
                for (const elData of savedElements) {
                    const box = elementBoxFromSaved(elData, container);
                    const source = elData.source ?? elData.src;
                    if (!source) continue;
                    createPastedImage(source, container, box.x, box.y, box.w, box.h, !!elData.locked, !!elData.background);
                }
                if (!pageObj._elementsDirty) pageObj._savedElements = savedElements;
                deselectPastedElements();
            }

            setupDrawingEvents(pageObj);
            updatePageIndicator();
            if (typeof isLoadingNotebook !== 'undefined' && !isLoadingNotebook) scheduleAutosave();
            return pageObj;
        }

        function drawSavedImageToCanvas(pageObj, source){
            return new Promise(resolve => {
                const img = new Image();
                const {url, revoke} = sourceToImageUrl(source);
                img.onload = () => {
                    pageObj.drawCtx.save();
                    pageObj.drawCtx.setTransform(1,0,0,1,0,0);
                    pageObj.drawCtx.clearRect(0,0,pageObj.drawCanvas.width,pageObj.drawCanvas.height);
                    pageObj.drawCtx.drawImage(img, 0, 0, pageObj.drawCanvas.width, pageObj.drawCanvas.height);
                    pageObj.drawCtx.restore();
                    if (revoke) URL.revokeObjectURL(url);
                    resolve();
                };
                img.onerror = () => { if (revoke) URL.revokeObjectURL(url); resolve(); };
                img.src = url;
            });
        }

        function resizePageCanvases(page) {
            const rect = page.container.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            let tempCanvas = null;
            if (page.drawCanvas.width > 0 && page.drawCanvas.height > 0) {
                tempCanvas = document.createElement('canvas');
                tempCanvas.width = page.drawCanvas.width;
                tempCanvas.height = page.drawCanvas.height;
                tempCanvas.getContext('2d').drawImage(page.drawCanvas, 0, 0);
            }

            const newW = Math.max(1, Math.round(rect.width * PIXEL_RATIO));
            const newH = Math.max(1, Math.round(rect.height * PIXEL_RATIO));
            page.bgCanvas.width = newW;
            page.bgCanvas.height = newH;
            page.drawCanvas.width = newW;
            page.drawCanvas.height = newH;

            page.bgCtx.setTransform(PIXEL_RATIO,0,0,PIXEL_RATIO,0,0);
            page.drawCtx.setTransform(PIXEL_RATIO,0,0,PIXEL_RATIO,0,0);
            page.drawCtx.lineCap = 'round';
            page.drawCtx.lineJoin = 'round';

            if (tempCanvas) {
                page.drawCtx.save();
                page.drawCtx.setTransform(1,0,0,1,0,0);
                page.drawCtx.drawImage(tempCanvas,0,0,newW,newH);
                page.drawCtx.restore();
            }
            if (page.linePreview) {
                page.linePreview.width = newW;
                page.linePreview.height = newH;
            }
        }

        function changeBackgroundAll() {
            pagesData.forEach(drawBackground);
            scheduleAutosave();
        }

        function drawBackground(page) {
            const ctx = page.bgCtx;
            const w = page.bgCanvas.width / PIXEL_RATIO;
            const h = page.bgCanvas.height / PIXEL_RATIO;
            const type = document.getElementById('bgType').value;
            ctx.save();
            ctx.setTransform(PIXEL_RATIO,0,0,PIXEL_RATIO,0,0);
            ctx.fillStyle = '#fff';
            ctx.fillRect(0,0,w,h);
            if (type === 'rayada') {
                ctx.strokeStyle = '#8bc34a'; ctx.lineWidth = 1;
                for(let y=50;y<h;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
                ctx.strokeStyle='rgba(255,0,0,.4)';ctx.beginPath();ctx.moveTo(60,0);ctx.lineTo(60,h);ctx.stroke();
            } else if (type === 'cuadriculada') {
                ctx.strokeStyle='rgba(0,150,255,.25)';ctx.lineWidth=1;const step=20;
                for(let x=0;x<w;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
                for(let y=0;y<h;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
                ctx.strokeStyle='rgba(255,0,0,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(step*3,0);ctx.lineTo(step*3,h);ctx.stroke();
            }
            ctx.restore();
        }

        function disposePastedElement(el){
            if (el?._objectUrl) {
                try { URL.revokeObjectURL(el._objectUrl); } catch(_){}
                el._objectUrl = null;
            }
        }

        function disposeCurrentPages(){
            for (const page of pagesData) {
                pageResizeObserver.unobserve(page.container);
                if(page._resizeRaf) cancelAnimationFrame(page._resizeRaf);
                page.container.querySelectorAll('.pasted-element').forEach(disposePastedElement);
            }
        }

        function clearCanvas(page){
            page.drawCtx.save();
            page.drawCtx.setTransform(1,0,0,1,0,0);
            page.drawCtx.clearRect(0,0,page.drawCanvas.width,page.drawCanvas.height);
            page.drawCtx.restore();
        }

        function clearCurrentPage() {
            if(!activePageContainer) return;
            const page = pagesData.find(p => p.container === activePageContainer);
            if(!page) return;
            clearCanvas(page);
            activePageContainer.querySelectorAll('.pasted-element').forEach(el => { disposePastedElement(el); el.remove(); });
            page._canvasDirty = true;
            page._elementsDirty = true;
            scheduleAutosave();
            toast('🧹 Hoja limpiada');
        }

        async function duplicatePage(){
            const p = pagesData.find(x => x.container === activePageContainer) || pagesData.at(-1);
            if(!p) return;
            try {
                const drawing = await canvasToBlob(p.drawCanvas);
                const elements = await serializeElements(p);
                await addPage(drawing, document.getElementById('bgType').value, elements);
                scheduleAutosave();
                toast('📑 Hoja duplicada');
            } catch(err) {
                console.error(err); toast('⚠️ No se pudo duplicar la hoja');
            }
        }

        function updatePageIndicator(){
            const ind = document.getElementById('pageIndicator');
            if(!ind) return;
            const found = pagesData.findIndex(p => p.container === activePageContainer);
            const idx = found >= 0 ? found + 1 : (pagesData.length ? 1 : 0);
            ind.textContent = `Hoja ${idx} de ${pagesData.length}`;
        }

        // ================= MOTOR DE DIBUJO =================
        function setupDrawingEvents(page) {
            const canvas = page.drawCanvas;
            canvas.addEventListener('pointerdown', e => {
                if (activeDrawingPointerId !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;
                try { canvas.setPointerCapture(e.pointerId); } catch(_){}
                startDrawing(e, page);
            }, {passive:false});
            canvas.addEventListener('pointermove', e => draw(e, page), {passive:false});
        }

        function getMousePos(canvas, e) {
            const rect = drawRectCache || canvas.getBoundingClientRect();
            return {x:e.clientX - rect.left, y:e.clientY - rect.top};
        }

        function ensureLinePreview(page){
            if(page.linePreview) return page.linePreview;
            const c=document.createElement('canvas');
            c.className='line-preview-layer';
            c.width=page.drawCanvas.width;c.height=page.drawCanvas.height;
            page.container.appendChild(c);
            page.linePreview=c;
            page.linePreviewCtx=c.getContext('2d');
            return c;
        }

        function startDrawing(e, page) {
            if(e.target.tagName.toLowerCase()==='canvas') deselectPastedElements();
            activePageContainer=page.container;
            activeDrawingPointerId=e.pointerId;
            isDrawing=true;
            drawRectCache=page.drawCanvas.getBoundingClientRect();
            const pos=getMousePos(page.drawCanvas,e);
            lastX=pos.x;lastY=pos.y;
            if(currentTool==='line'){
                page.startX=pos.x;page.startY=pos.y;
                const preview=ensureLinePreview(page);
                preview.width=page.drawCanvas.width;preview.height=page.drawCanvas.height;preview.style.display='block';
                page.linePreviewCtx.setTransform(PIXEL_RATIO,0,0,PIXEL_RATIO,0,0);
                page.linePreviewCtx.clearRect(0,0,page.drawCanvas.clientWidth,page.drawCanvas.clientHeight);
            } else draw(e,page);
        }

        function draw(e,page){
            if(!isDrawing || e.pointerId!==activeDrawingPointerId) return;
            e.preventDefault();
            const ctx=page.drawCtx;
            const rect=drawRectCache;
            const events=e.getCoalescedEvents?e.getCoalescedEvents():[e];
            if(currentTool==='line'){
                const ev=events.at(-1);
                const pos={x:ev.clientX-rect.left,y:ev.clientY-rect.top};
                const pctx=page.linePreviewCtx;
                pctx.setTransform(PIXEL_RATIO,0,0,PIXEL_RATIO,0,0);
                pctx.clearRect(0,0,page.drawCanvas.clientWidth,page.drawCanvas.clientHeight);
                pctx.globalCompositeOperation='source-over';pctx.globalAlpha=1;pctx.strokeStyle=strokeColor;pctx.lineWidth=strokeSize;pctx.lineCap='round';pctx.lineJoin='round';
                pctx.beginPath();pctx.moveTo(page.startX,page.startY);pctx.lineTo(pos.x,pos.y);pctx.stroke();
                return;
            }
            for(const ev of events){
                const pos={x:ev.clientX-rect.left,y:ev.clientY-rect.top};
                ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(pos.x,pos.y);
                if(currentTool==='eraser'){
                    ctx.globalCompositeOperation='destination-out';ctx.lineWidth=strokeSize*8;ctx.strokeStyle='#000';ctx.globalAlpha=1;
                } else {
                    ctx.globalCompositeOperation='source-over';ctx.strokeStyle=strokeColor;
                    if(currentTool==='pen'){ctx.globalAlpha=1;ctx.lineWidth=strokeSize;}
                    else if(currentTool==='pencil'){
                        const pressure=(typeof ev.pressure==='number' && ev.pressure>0)?ev.pressure:0.5;
                        ctx.globalAlpha=.42;ctx.lineWidth=strokeSize*Math.max(.2,pressure);
                    }
                }
                ctx.stroke();lastX=pos.x;lastY=pos.y;
            }
        }

        function stopDrawing(e){
            if(!isDrawing) return;
            if(e && typeof e.pointerId==='number' && e.pointerId!==activeDrawingPointerId) return;
            const page=pagesData.find(p=>p.container===activePageContainer);
            if(page && currentTool==='line' && drawRectCache){
                const ev=e||window.event;
                if(ev && typeof ev.clientX==='number'){
                    const pos={x:ev.clientX-drawRectCache.left,y:ev.clientY-drawRectCache.top};
                    page.drawCtx.save();page.drawCtx.globalCompositeOperation='source-over';page.drawCtx.globalAlpha=1;page.drawCtx.strokeStyle=strokeColor;page.drawCtx.lineWidth=strokeSize;page.drawCtx.lineCap='round';page.drawCtx.lineJoin='round';
                    page.drawCtx.beginPath();page.drawCtx.moveTo(page.startX,page.startY);page.drawCtx.lineTo(pos.x,pos.y);page.drawCtx.stroke();page.drawCtx.restore();
                }
                if(page.linePreviewCtx) page.linePreviewCtx.clearRect(0,0,page.linePreview.width,page.linePreview.height);
                if(page.linePreview) page.linePreview.style.display='none';
            }
            isDrawing=false;activeDrawingPointerId=null;drawRectCache=null;
            if(page) page._canvasDirty=true;
            scheduleAutosave();
        }
        window.addEventListener('pointerup', stopDrawing, {passive:true});
        window.addEventListener('pointercancel', stopDrawing, {passive:true});

        // ================= POSICIONAMIENTO / OBJETOS =================
        function getVisibleContainer() {
            let target=activePageContainer || pagesData[0]?.container || null;
            if(!target) return null;
            let maxVis=0;
            for(const p of pagesData){
                const r=p.container.getBoundingClientRect();
                const vis=Math.max(0,Math.min(window.innerHeight,r.bottom)-Math.max(0,r.top));
                if(vis>maxVis){maxVis=vis;target=p.container;}
            }
            activePageContainer=target;updatePageIndicator();return target;
        }

        function getCenterPosRelative(container,objWidth,objHeight){
            const r=container.getBoundingClientRect();
            const safeW=Math.min(objWidth,Math.max(20,r.width-20));
            const safeH=Math.min(objHeight,Math.max(20,r.height-20));
            const visTop=Math.max(0,r.top),visBot=Math.min(window.innerHeight,r.bottom);
            const centerY=visTop+(Math.max(0,visBot-visTop))/2;
            const localY=centerY-r.top-safeH/2;
            const localX=r.width/2-safeW/2;
            return {x:clamp(localX,10,Math.max(10,r.width-safeW-10)),y:clamp(localY,10,Math.max(10,r.height-safeH-10))};
        }

        function setElementBoxPx(wrapper, container, x, y, w, h){
            const cw=Math.max(1,container.clientWidth),ch=Math.max(1,container.clientHeight);
            wrapper.style.left=(100*x/cw)+'%';
            wrapper.style.top=(100*y/ch)+'%';
            wrapper.style.width=(100*w/cw)+'%';
            if(Number.isFinite(h)) wrapper.style.height=(100*h/ch)+'%';
        }

        function markPastedElementChanged(wrapper){
            const page=pagesData.find(p=>p.container===wrapper.parentElement);
            if(page) page._elementsDirty=true;
            scheduleAutosave();
        }

        function createPastedImage(src, container, x, y, w, h, locked=false, background=false) {
            const wrapper=document.createElement('div');wrapper.className='pasted-element';
            if(locked) wrapper.classList.add('pdf-locked');
            if(background) wrapper.classList.add('pdf-background');

            const initialW=clamp(Number(w)||300,50,Math.max(50,container.clientWidth-20));
            const initialX=clamp(Number(x)||10,0,Math.max(0,container.clientWidth-initialW));
            const initialY=clamp(Number(y)||10,0,Math.max(0,container.clientHeight-50));
            if(Number.isFinite(Number(h))) {
                const initialH=clamp(Number(h),20,Math.max(20,container.clientHeight-initialY));
                setElementBoxPx(wrapper,container,initialX,initialY,initialW,initialH);
            } else {
                setElementBoxPx(wrapper,container,initialX,initialY,initialW,100);
                wrapper.style.height='auto';
            }

            const img=document.createElement('img');img.className='pasted-image';
            const srcInfo=sourceToImageUrl(src);
            img.src=srcInfo.url;
            wrapper._sourceBlob=src instanceof Blob ? src : null;
            wrapper._objectUrl=srcInfo.revoke ? srcInfo.url : null;

            const resizeHandle=document.createElement('div');resizeHandle.className='resize-handle';
            const tools=document.createElement('div');tools.className='object-tools';
            const lockBtn=document.createElement('button');lockBtn.textContent=locked?'🔓':'🔒';lockBtn.title='Bloquear/Desbloquear';
            const bgBtn=document.createElement('button');bgBtn.textContent='📌';bgBtn.title='Fondo fijo';
            const deleteBtn=document.createElement('button');deleteBtn.textContent='🗑️';deleteBtn.className='btn-delete';deleteBtn.title='Eliminar elemento';
            tools.append(lockBtn,bgBtn,deleteBtn);
            wrapper.append(img,resizeHandle,tools);
            container.appendChild(wrapper);

            img.onload=()=>{
                if(!h){
                    const cw=container.clientWidth,ch=container.clientHeight;
                    let width=wrapper.getBoundingClientRect().width || initialW;
                    let height=width*(img.naturalHeight/Math.max(1,img.naturalWidth));
                    const top=wrapper.offsetTop;
                    if(height>ch-top-10){height=Math.max(20,ch-top-10);width=height*(img.naturalWidth/Math.max(1,img.naturalHeight));}
                    setElementBoxPx(wrapper,container,wrapper.offsetLeft,top,width,height);
                }
            };

            deselectPastedElements();wrapper.classList.add('active-element');activePastedElement=wrapper;

            lockBtn.onclick=e=>{e.stopPropagation();wrapper.classList.toggle('pdf-locked');lockBtn.textContent=wrapper.classList.contains('pdf-locked')?'🔓':'🔒';markPastedElementChanged(wrapper);};
            bgBtn.onclick=e=>{e.stopPropagation();wrapper.classList.toggle('pdf-background');wrapper.classList.add('pdf-locked');lockBtn.textContent='🔓';markPastedElementChanged(wrapper);toast(wrapper.classList.contains('pdf-background')?'📌 Fijado como fondo':'Liberado de fondo');};
            deleteBtn.onclick=e=>{e.stopPropagation();const page=pagesData.find(p=>p.container===container);if(page)page._elementsDirty=true;disposePastedElement(wrapper);wrapper.remove();activePastedElement=null;scheduleAutosave();toast('🗑️ Recorte eliminado');};

            let isDragging=false,dragPointerId=null,grabOffsetX=0,grabOffsetY=0,startLeft=0,startTop=0,pendingLeft=0,pendingTop=0,dragRaf=0;
            const applyDrag=()=>{
                if(isDragging){
                    wrapper.style.transform=`translate3d(${pendingLeft-startLeft}px,${pendingTop-startTop}px,0)`;
                }
                dragRaf=0;
            };
            const finishDrag=e=>{
                if(!isDragging || (dragPointerId!==null && e && e.pointerId!==dragPointerId)) return;
                isDragging=false;dragPointerId=null;
                if(dragRaf) cancelAnimationFrame(dragRaf);
                wrapper.classList.remove('dragging');
                wrapper.style.transform='none';
                const rw=wrapper.getBoundingClientRect().width,rh=wrapper.getBoundingClientRect().height;
                setElementBoxPx(wrapper,container,pendingLeft,pendingTop,rw,rh);
                markPastedElementChanged(wrapper);
            };

            wrapper.addEventListener('pointerdown',e=>{
                if(e.target===resizeHandle || e.target.closest('.object-tools')) return;
                e.preventDefault();e.stopPropagation();
                deselectPastedElements();wrapper.classList.add('active-element');activePastedElement=wrapper;
                if(wrapper.classList.contains('pdf-locked')) return;
                const parentRect=container.getBoundingClientRect(),rect=wrapper.getBoundingClientRect();
                isDragging=true;dragPointerId=e.pointerId;grabOffsetX=e.clientX-rect.left;grabOffsetY=e.clientY-rect.top;
                startLeft=rect.left-parentRect.left;startTop=rect.top-parentRect.top;pendingLeft=startLeft;pendingTop=startTop;
                wrapper.classList.add('dragging');wrapper.setPointerCapture?.(e.pointerId);
            });
            wrapper.addEventListener('pointermove',e=>{
                if(!isDragging || e.pointerId!==dragPointerId) return;e.preventDefault();
                const parentRect=container.getBoundingClientRect(),rect=wrapper.getBoundingClientRect();
                const width=rect.width,height=rect.height;
                pendingLeft=clamp((e.clientX-parentRect.left)-grabOffsetX,0,Math.max(0,parentRect.width-width));
                pendingTop=clamp((e.clientY-parentRect.top)-grabOffsetY,0,Math.max(0,parentRect.height-height));
                if(!dragRaf) dragRaf=requestAnimationFrame(applyDrag);
            },{passive:false});
            wrapper.addEventListener('pointerup',finishDrag);
            wrapper.addEventListener('pointercancel',finishDrag);

            let isResizing=false,resizePointerId=null,startResX=0,startW=0,startH=0,startLeftPx=0,startTopPx=0;
            const finishResize=e=>{
                if(!isResizing || (e && e.pointerId!==resizePointerId)) return;
                isResizing=false;resizePointerId=null;markPastedElementChanged(wrapper);
            };
            resizeHandle.addEventListener('pointerdown',e=>{
                e.preventDefault();e.stopPropagation();
                if(wrapper.classList.contains('pdf-locked')) return;
                isResizing=true;resizePointerId=e.pointerId;startResX=e.clientX;startW=wrapper.getBoundingClientRect().width;startH=wrapper.getBoundingClientRect().height;startLeftPx=wrapper.offsetLeft;startTopPx=wrapper.offsetTop;
                resizeHandle.setPointerCapture?.(e.pointerId);
            });
            resizeHandle.addEventListener('pointermove',e=>{
                if(!isResizing || e.pointerId!==resizePointerId) return;e.preventDefault();
                const maxW=Math.max(50,container.clientWidth-startLeftPx);
                const newWidth=clamp(startW+(e.clientX-startResX),50,maxW);
                const ratio=startH/Math.max(1,startW);
                let newHeight=newWidth*ratio;
                if(newHeight>container.clientHeight-startTopPx){newHeight=Math.max(20,container.clientHeight-startTopPx);}
                const correctedWidth=newHeight/Math.max(.0001,ratio);
                setElementBoxPx(wrapper,container,startLeftPx,startTopPx,correctedWidth,newHeight);
            },{passive:false});
            resizeHandle.addEventListener('pointerup',finishResize);
            resizeHandle.addEventListener('pointercancel',finishResize);

            return wrapper;
        }

        function deselectPastedElements(){
            document.querySelectorAll('.pasted-element').forEach(el=>el.classList.remove('active-element'));
            activePastedElement=null;
        }

        window.addEventListener('keydown',e=>{
            if((e.key==='Delete'||e.key==='Backspace') && activePastedElement && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target?.tagName||'')){
                const el=activePastedElement;const page=pagesData.find(p=>p.container===el.parentElement);if(page)page._elementsDirty=true;activePastedElement=null;disposePastedElement(el);el.remove();scheduleAutosave();e.preventDefault();
            }
        });

        async function handleAnyFile(e) {
            const files=[...(e.target.files||[])];
            if(!files.length) return;
            for(const file of files){
                if(file.type.startsWith('image/')){
                    const notebookId=currentId;
                    const target=getVisibleContainer();
                    if(!target) continue;
                    const w=Math.min(Math.max(80,target.clientWidth-40),300);
                    const pos=getCenterPosRelative(target,w,200);
                    await nextFrame();
                    if(currentId!==notebookId || !target.isConnected){toast('⚠️ Cambiaste de cuaderno antes de insertar la imagen');continue;}
                    createPastedImage(file,target,pos.x,pos.y,w,null);
                    const page=pagesData.find(p=>p.container===target);if(page)page._elementsDirty=true;
                    scheduleAutosave();
                } else if(file.type==='application/pdf'){
                    await window.loadFile(file);
                    if(!document.getElementById('pdfStudio').classList.contains('open')) await togglePdfStudio();
                } else toast('⚠️ Formato no soportado. Usa imágenes o PDF.');
            }
            e.target.value='';
        }

        // ================= ALMACENAMIENTO: ÍNDICE LIGERO + INDEXEDDB =================
        const NB_KEY='cuadernosMaterias_pro';
        const DATA_DB='cuadernoData_pro';
        const DATA_STORE='notebooks';
        let currentId=null;
        let saveTimer=0;
        let saveChain=Promise.resolve();
        let isLoadingNotebook=false;

        function uid(){return 'nb_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);}
        function readStore(){
            try {
                const parsed=JSON.parse(localStorage.getItem(NB_KEY));
                return parsed && Array.isArray(parsed.items) ? parsed : {version:2,current:null,items:[]};
            } catch(e) { console.warn('Índice local dañado',e); return {version:2,current:null,items:[]}; }
        }
        function writeStore(x){
            try { localStorage.setItem(NB_KEY,JSON.stringify(x)); return true; }
            catch(err){ console.error(err); toast('⚠️ No se pudo guardar el índice local'); return false; }
        }

        function openDataDB(){
            return new Promise((resolve,reject)=>{
                const req=indexedDB.open(DATA_DB,1);
                req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DATA_STORE))db.createObjectStore(DATA_STORE,{keyPath:'id'});};
                req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
            });
        }
        async function dataDbPut(value){
            const db=await openDataDB();
            return new Promise((resolve,reject)=>{const tx=db.transaction(DATA_STORE,'readwrite');tx.objectStore(DATA_STORE).put(value);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Transacción cancelada'));});
        }
        async function dataDbGet(id){
            const db=await openDataDB();
            return new Promise((resolve,reject)=>{const req=db.transaction(DATA_STORE,'readonly').objectStore(DATA_STORE).get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});
        }
        async function dataDbClear(){
            const db=await openDataDB();
            return new Promise((resolve,reject)=>{const tx=db.transaction(DATA_STORE,'readwrite');tx.objectStore(DATA_STORE).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});
        }

        async function serializeElement(el,page){
            const img=el.querySelector('img');
            let source=el._sourceBlob;
            if(!source && img?.src) { source=await sourceToBlob(img.src); el._sourceBlob=source; }
            const cw=Math.max(1,page.container.clientWidth),ch=Math.max(1,page.container.clientHeight);
            const x=el.offsetLeft,y=el.offsetTop,w=el.offsetWidth,h=el.offsetHeight;
            return {source,xRatio:x/cw,yRatio:y/ch,wRatio:w/cw,hRatio:h/ch,locked:el.classList.contains('pdf-locked'),background:el.classList.contains('pdf-background')};
        }
        async function serializeElements(page){
            const out=[];
            for(const el of page.container.querySelectorAll('.pasted-element')) out.push(await serializeElement(el,page));
            return out;
        }

        async function snapshotNotebook(){
            const bg=document.getElementById('bgType')?.value||'rayada';
            const result={bg,pages:[]};
            const states=[];
            for(const p of pagesData){
                let drawing=p._savedDrawing;
                if(p._canvasDirty || !drawing) drawing=await canvasToBlob(p.drawCanvas);
                else if(typeof drawing==='string') drawing=await sourceToBlob(drawing);
                let elements=p._savedElements;
                if(p._elementsDirty || !Array.isArray(elements)) elements=await serializeElements(p);
                result.pages.push({drawing,elements});
                states.push({page:p,drawing,elements});
            }
            return {snapshot:result,states};
        }

        function scheduleAutosave(){
            clearTimeout(saveTimer);
            saveTimer=setTimeout(()=>{
                const run=()=>flushNotebookNow();
                if(window.requestIdleCallback) requestIdleCallback(run,{timeout:1500}); else run();
            },1800);
        }

        function flushNotebookNow(){
            const targetId=currentId;
            if(!targetId || isLoadingNotebook) return Promise.resolve(false);
            saveChain=saveChain.then(async()=>{
                if(!targetId) return false;
                try{
                    const {snapshot,states}=await snapshotNotebook();
                    await dataDbPut({id:targetId,...snapshot,updatedAt:Date.now()});
                    for(const s of states){s.page._savedDrawing=s.drawing;s.page._savedElements=s.elements;s.page._canvasDirty=false;s.page._elementsDirty=false;}
                    const st=readStore();
                    const it=st.items.find(x=>x.id===targetId);
                    if(it){it.bg=snapshot.bg;it.pageCount=snapshot.pages.length;it.storage='idb';delete it.pages;}
                    st.version=2;st.current=targetId;writeStore(st);
                    if(document.getElementById('nb-drawer')?.classList.contains('open')) renderList();
                    return true;
                }catch(err){console.error('Error guardando cuaderno',err);toast('⚠️ No se pudo guardar. Revisa el espacio del navegador.',3000);return false;}
            });
            return saveChain;
        }

        async function resolveNotebookSnapshot(item){
            if(!item) return {bg:'rayada',pages:[]};
            try {
                const idb=await dataDbGet(item.id);
                if(idb?.pages) return {bg:idb.bg||item.bg||'rayada',pages:idb.pages};
            } catch(err){console.warn('No se pudo leer IndexedDB',err);}
            if(Array.isArray(item.pages)){
                return {bg:item.bg||'rayada',pages:item.pages.map(pg=>({drawing:pg.drawing??pg.imgData??null,elements:pg.elements||[]}))};
            }
            return {bg:item.bg||'rayada',pages:[]};
        }

        async function loadNotebook(item){
            if(!item) return;
            isLoadingNotebook=true;
            try{
                const snapshot=await resolveNotebookSnapshot(item);
                const st=readStore();st.current=item.id;writeStore(st);currentId=item.id;
                disposeCurrentPages();notebookEl.replaceChildren();pagesData=[];activePageContainer=null;activePastedElement=null;
                document.getElementById('bgType').value=snapshot.bg||'rayada';
                if (typeof pdfDoc !== 'undefined') { pdfDoc=null; currentPdfId=null; pdfPage=1; document.getElementById('pdfPageLabel').textContent='Sin PDF'; document.getElementById('pdfView').replaceChildren(); }
                const pages=snapshot.pages?.length?snapshot.pages:[{drawing:null,elements:[]}];
                for(const pg of pages) await addPage(pg.drawing??pg.imgData??null,snapshot.bg||'rayada',pg.elements||[]);
                updatePageIndicator();renderList();toast('📖 '+item.name);
            } finally { isLoadingNotebook=false; }
            // Si venía del formato viejo, el próximo guardado lo migra sin pérdida.
            scheduleAutosave();
        }

        window.toggleNotebookManager=function(){document.getElementById('nb-drawer').classList.toggle('open');document.getElementById('nb-overlay').classList.toggle('open');renderList();};

        function renderList(){
            const out=document.getElementById('nb-list'),st=readStore();
            out.replaceChildren();
            if(!st.items.length){const empty=document.createElement('div');empty.style.cssText='text-align:center;color:#9ca3af;';empty.textContent='No hay cuadernos.';out.appendChild(empty);return;}
            for(const it of st.items){
                const row=document.createElement('div');row.className='nb-item'+(it.id===currentId?' active':'');
                const name=document.createElement('span');name.className='nb-name';name.textContent='📘 '+it.name;
                const count=document.createElement('span');count.style.cssText='font-size:12px;color:#a0aec0;';count.textContent=`${it.pageCount??it.pages?.length??0} hojas`;
                row.append(name,count);row.addEventListener('click',()=>switchNotebook(it.id));out.appendChild(row);
            }
        }

        window.switchNotebook=async function(id){
            if(id===currentId){toggleNotebookManager();return;}
            await flushNotebookNow();
            const st=readStore(),item=st.items.find(x=>x.id===id);
            if(item) await loadNotebook(item);
            toggleNotebookManager();
        };
        window.createNotebook=async function(){
            await flushNotebookNow();
            const name=prompt('Nombre de la materia / cuaderno:','Nueva Materia');if(!name?.trim())return;
            const st=readStore(),item={id:uid(),name:name.trim(),bg:'rayada',pageCount:0,storage:'idb'};
            st.items.push(item);st.current=item.id;st.version=2;writeStore(st);currentId=item.id;
            await dataDbPut({id:item.id,bg:'rayada',pages:[],updatedAt:Date.now()});
            await loadNotebook(item);toggleNotebookManager();
        };
        window.renameCurrentNotebook=function(){
            const st=readStore(),it=st.items.find(x=>x.id===currentId);if(!it)return;
            const n=prompt('Nuevo nombre:',it.name);if(!n?.trim())return;it.name=n.trim();writeStore(st);renderList();toast('✏️ Nombre actualizado');
        };

        async function bootstrap(){
            const st=readStore();
            if(!st.items.length){
                const first={id:uid(),name:'General',bg:'rayada',pageCount:0,storage:'idb'};
                st.items=[first];st.current=first.id;st.version=2;writeStore(st);currentId=first.id;
                await dataDbPut({id:first.id,bg:'rayada',pages:[],updatedAt:Date.now()});
                await loadNotebook(first);
            } else {
                currentId=st.current&&st.items.some(x=>x.id===st.current)?st.current:st.items[0].id;
                await loadNotebook(st.items.find(x=>x.id===currentId)||st.items[0]);
            }
            renderList();
        }
        window.addEventListener('load',()=>{bootstrap().catch(err=>{console.error(err);toast('⚠️ Error iniciando el cuaderno',3000);});});
        window.addEventListener('pagehide',()=>{flushNotebookNow();});
        document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushNotebookNow();});

        // ================= BACKUP COMPLETO (CUADERNOS + PDFs) =================
        async function snapshotForBackup(snapshot){
            const out={bg:snapshot.bg,pages:[]};
            for(const pg of snapshot.pages||[]){
                const drawingBlob=pg.drawing?await sourceToBlob(pg.drawing):null;
                const elements=[];
                for(const el of pg.elements||[]){
                    const source=el.source??el.src;
                    const blob=source?await sourceToBlob(source):null;
                    elements.push({...el,source:blob?await blobToDataURL(blob):null,src:undefined});
                }
                out.pages.push({drawing:drawingBlob?await blobToDataURL(drawingBlob):null,elements});
            }
            return out;
        }
        async function backupToSnapshot(data){
            const out={bg:data.bg||'rayada',pages:[]};
            for(const pg of data.pages||[]){
                const drawing=pg.drawing?dataURLToBlob(pg.drawing):null;
                const elements=(pg.elements||[]).map(el=>({...el,source:el.source?dataURLToBlob(el.source):(el.src?dataURLToBlob(el.src):null)}));
                out.pages.push({drawing,elements});
            }
            return out;
        }

        async function descargarRespaldo(){
            toast('📦 Preparando backup completo…',2500);
            await flushNotebookNow();
            try{
                const st=readStore();
                const notebooks=[];
                for(const item of st.items){
                    const snap=await resolveNotebookSnapshot(item);
                    notebooks.push({id:item.id,data:await snapshotForBackup(snap)});
                }
                const pdfs=(await dbListAll()).map(rec=>({id:rec.id,notebook:rec.notebook,name:rec.name,bytesBase64:arrayBufferToBase64(rec.bytes instanceof ArrayBuffer?rec.bytes:new Uint8Array(rec.bytes).buffer)}));
                const cleanIndex={version:2,current:st.current,items:st.items.map(({pages,...rest})=>rest)};
                const data={version:2,exportedAt:new Date().toISOString(),index:cleanIndex,notebooks,pdfs};
                const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
                const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Cuadernos_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
                toast('✅ Backup completo descargado');
            }catch(err){console.error(err);toast('⚠️ No se pudo generar el backup',3000);}
        }

        function cargarRespaldo(){
            const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
            input.onchange=async e=>{
                const file=e.target.files?.[0];if(!file)return;
                try{
                    const datos=JSON.parse(await file.text());
                    if(datos.version===2 && datos.index && Array.isArray(datos.notebooks)){
                        if(!confirm('Esto reemplazará los cuadernos y PDFs actuales. ¿Continuar?')) return;
                        await dataDbClear();await dbClear();
                        for(const nb of datos.notebooks){const snap=await backupToSnapshot(nb.data||{});await dataDbPut({id:nb.id,...snap,updatedAt:Date.now()});}
                        for(const rec of datos.pdfs||[]){await dbPut({id:rec.id,notebook:rec.notebook,name:rec.name,bytes:base64ToArrayBuffer(rec.bytesBase64)});}
                        writeStore(datos.index);alert('¡Respaldo restaurado correctamente!');location.reload();return;
                    }
                    if(datos.materias){
                        if(!confirm('Backup antiguo detectado. ¿Restaurarlo?')) return;
                        localStorage.setItem(NB_KEY,datos.materias);alert('¡Respaldo antiguo restaurado! Se migrará automáticamente al abrirlo.');location.reload();return;
                    }
                    throw new Error('Formato no reconocido');
                }catch(err){console.error(err);alert('Error: Archivo de backup no válido o dañado.');}
            };
            input.click();
        }

        // ================= PDF STUDIO =================
        const PDF_DB='cuadernoPDFs_pro',PDF_STORE='pdfs';
        let pdfDoc=null,pdfPage=1,pdfScale=1.2,pdfCrop=false,pdfCropRect=null,currentPdfId=null;
        let pdfRenderTask=null,pdfRenderToken=0;
        const pdfJsReady=import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs').then(mod=>{window.__pdfjs=mod;mod.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';return mod;}).catch(err=>{console.error(err);toast('⚠️ No se pudo cargar el motor PDF',3000);throw err;});

        function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(PDF_DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(PDF_STORE))db.createObjectStore(PDF_STORE,{keyPath:'id'}).createIndex('notebook','notebook',{unique:false});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
        async function dbPut(v){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(PDF_STORE,'readwrite');tx.objectStore(PDF_STORE).put(v);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
        async function dbGet(id){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(PDF_STORE,'readonly').objectStore(PDF_STORE).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
        async function dbList(nb){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(PDF_STORE,'readonly').objectStore(PDF_STORE).index('notebook').getAll(nb);r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}
        async function dbListAll(){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(PDF_STORE,'readonly').objectStore(PDF_STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}
        async function dbClear(){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(PDF_STORE,'readwrite');tx.objectStore(PDF_STORE).clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}

        window.searchGooglePDF=function(){
            const query=document.getElementById('pdfGoogleSearchInput').value.trim();if(!query)return;
            window.open('https://www.google.com/search?q='+encodeURIComponent(query+' filetype:pdf')+'&udm=14','_blank','noopener,noreferrer');toast('Buscando PDFs en internet…');
        };
        window.togglePdfStudio=async function(){const el=document.getElementById('pdfStudio');el.classList.toggle('open');if(el.classList.contains('open'))await refreshPdfLibrary();};
        window.pdfZoom=function(d){pdfScale=clamp(pdfScale+d*.2,.65,3);document.getElementById('pdfZoomLabel').textContent=Math.round(pdfScale*100)+'%';if(pdfDoc)renderPdfPage(pdfPage);};

        async function renderPdfPage(n){
            if(!pdfDoc)return;
            const token=++pdfRenderToken;
            if(pdfRenderTask){try{pdfRenderTask.cancel();}catch(_){}pdfRenderTask=null;}
            pdfPage=clamp(n,1,pdfDoc.numPages);
            try{
                const page=await pdfDoc.getPage(pdfPage);if(token!==pdfRenderToken)return;
                const vp=page.getViewport({scale:pdfScale});const view=document.getElementById('pdfView');view.replaceChildren();
                const wrap=document.createElement('div');wrap.className='pdf-page-wrap';wrap.style.width=vp.width+'px';wrap.style.height=vp.height+'px';wrap.style.touchAction='none';
                const canvas=document.createElement('canvas');canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);canvas.style.width=vp.width+'px';canvas.style.height=vp.height+'px';
                const crop=document.createElement('div');crop.className='pdf-crop-box';wrap.append(canvas,crop);view.appendChild(wrap);
                pdfRenderTask=page.render({canvasContext:canvas.getContext('2d',{alpha:false}),viewport:vp});await pdfRenderTask.promise;if(token!==pdfRenderToken)return;pdfRenderTask=null;
                pdfCropRect=null;crop.style.display='none';document.getElementById('pdfPageLabel').textContent='Pág '+pdfPage+' / '+pdfDoc.numPages;
                let start=null;
                wrap.onpointerdown=e=>{if(!pdfCrop)return;e.preventDefault();const r=wrap.getBoundingClientRect();start={x:clamp(e.clientX-r.left,0,r.width),y:clamp(e.clientY-r.top,0,r.height)};wrap.setPointerCapture?.(e.pointerId);pdfCropRect={x:start.x,y:start.y,w:0,h:0};crop.style.display='block';Object.assign(crop.style,{left:start.x+'px',top:start.y+'px',width:'0px',height:'0px'});};
                wrap.onpointermove=e=>{if(!pdfCrop||!start)return;const r=wrap.getBoundingClientRect(),ex=clamp(e.clientX-r.left,0,r.width),ey=clamp(e.clientY-r.top,0,r.height),x=Math.min(start.x,ex),y=Math.min(start.y,ey),w=Math.abs(ex-start.x),h=Math.abs(ey-start.y);pdfCropRect={x,y,w,h};Object.assign(crop.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});};
                const finish=e=>{if(!start)return;try{wrap.releasePointerCapture?.(e.pointerId);}catch(_){}start=null;if(pdfCropRect&&pdfCropRect.w>15&&pdfCropRect.h>15)toast('✂️ Área seleccionada. Toca “Pegar Recorte”');else{pdfCropRect=null;crop.style.display='none';}};
                wrap.onpointerup=finish;wrap.onpointercancel=finish;
            }catch(err){if(err?.name!=='RenderingCancelledException'){console.error(err);toast('⚠️ Error renderizando PDF');}}
        }

        async function openPdfRecord(rec){
            try{const mod=await pdfJsReady;const bytes=rec.bytes instanceof ArrayBuffer?rec.bytes:new Uint8Array(rec.bytes);pdfDoc=await mod.getDocument({data:bytes}).promise;currentPdfId=rec.id;pdfPage=1;await renderPdfPage(1);document.getElementById('pdfPageLabel').textContent=rec.name+' - Pág 1';await refreshPdfLibrary();}
            catch(e){console.error(e);toast('Error al abrir PDF');}
        }
        async function refreshPdfLibrary(){
            if(!currentId)return;const list=await dbList(currentId),lib=document.getElementById('pdfLibrary');lib.replaceChildren();
            if(!list.length){const empty=document.createElement('div');empty.style.cssText='color:#94a3b8;font-size:12px;';empty.textContent='Sube un PDF para verlo aquí.';lib.appendChild(empty);return;}
            for(const x of list){const btn=document.createElement('button');btn.className='pdf-chip'+(x.id===currentPdfId?' active':'');btn.textContent='📄 '+x.name;btn.addEventListener('click',()=>loadLibraryPdf(x.id));lib.appendChild(btn);}
        }
        window.loadLibraryPdf=async id=>{const rec=await dbGet(id);if(rec)await openPdfRecord(rec);};
        window.loadFile=async f=>{
            if(!currentId)return;
            const notebookId=currentId;
            const bytes=await f.arrayBuffer();
            if(notebookId!==currentId){toast('⚠️ Cambiaste de cuaderno; el PDF no se guardó');return;}
            const rec={id:'pdf_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),notebook:notebookId,name:f.name,bytes};await dbPut(rec);await openPdfRecord(rec);toast('📄 PDF guardado');
        };
        document.getElementById('pdfFileInput').addEventListener('change',async e=>{for(const f of e.target.files||[])if(f.type==='application/pdf')await window.loadFile(f);e.target.value='';});
        window.pdfPrevPage=()=>pdfDoc&&renderPdfPage(pdfPage-1);window.pdfNextPage=()=>pdfDoc&&renderPdfPage(pdfPage+1);
        window.togglePdfCrop=function(){
            if(!pdfDoc){toast('Abrí un PDF primero');return;}pdfCrop=!pdfCrop;pdfCropRect=null;
            const btn=document.getElementById('pdfCropBtn');btn.textContent=pdfCrop?'✖️ Cancelar Selección':'✂️ Recortar Área';btn.style.background=pdfCrop?'#ef4444':'#2563eb';
            if(!pdfCrop)document.getElementById('pdfView').querySelector('.pdf-crop-box')?.style.setProperty('display','none');
        };

        window.pastePdfCropToNotebook=async function(){
            if(!pdfDoc||!pdfCropRect||pdfCropRect.w<8||pdfCropRect.h<8){toast('⚠️ Selecciona un área válida del PDF');return;}
            const wrap=document.getElementById('pdfView').querySelector('.pdf-page-wrap'),canvas=wrap?.querySelector('canvas');if(!wrap||!canvas)return;
            const bounds=wrap.getBoundingClientRect(),sx=canvas.width/bounds.width,sy=canvas.height/bounds.height;
            const sx0=Math.floor(pdfCropRect.x*sx),sy0=Math.floor(pdfCropRect.y*sy),sw=Math.max(1,Math.ceil(pdfCropRect.w*sx)),sh=Math.max(1,Math.ceil(pdfCropRect.h*sy));
            const out=document.createElement('canvas');out.width=sw;out.height=sh;out.getContext('2d').drawImage(canvas,sx0,sy0,sw,sh,0,0,sw,sh);
            const src=await canvasToBlob(out,'image/png',1);
            const target=getVisibleContainer();if(!target)return;
            const maxW=Math.max(50,target.clientWidth-40),maxH=Math.max(50,target.clientHeight-40);const scale=Math.min(maxW/sw,maxH/sh,1);const finalW=Math.max(20,sw*scale),finalH=Math.max(20,sh*scale);const pos=getCenterPosRelative(target,finalW,finalH);
            createPastedImage(src,target,pos.x,pos.y,finalW,finalH);const page=pagesData.find(p=>p.container===target);if(page)page._elementsDirty=true;scheduleAutosave();
            pdfCrop=false;const btn=document.getElementById('pdfCropBtn');btn.textContent='✂️ Recortar Área';btn.style.background='#2563eb';wrap.querySelector('.pdf-crop-box').style.display='none';toast('📋 Recorte pegado y centrado');
        };

        // Ventana PDF arrastrable, siempre recuperable dentro del viewport.
        const studio=document.getElementById('pdfStudio'),handle=document.getElementById('pdfDragHandle');let pdfDrag=null;
        function clampPdfStudio(){
            if(!studio.classList.contains('open'))return;const r=studio.getBoundingClientRect();
            const left=clamp(r.left,0,Math.max(0,window.innerWidth-Math.min(r.width,window.innerWidth)));
            const top=clamp(r.top,0,Math.max(0,window.innerHeight-46));studio.style.left=left+'px';studio.style.top=top+'px';studio.style.right='auto';
        }
        handle.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=studio.getBoundingClientRect();pdfDrag={id:e.pointerId,x:e.clientX-r.left,y:e.clientY-r.top};handle.setPointerCapture?.(e.pointerId);});
        handle.addEventListener('pointermove',e=>{if(!pdfDrag||e.pointerId!==pdfDrag.id)return;const maxX=Math.max(0,window.innerWidth-studio.offsetWidth),maxY=Math.max(0,window.innerHeight-46);studio.style.left=clamp(e.clientX-pdfDrag.x,0,maxX)+'px';studio.style.top=clamp(e.clientY-pdfDrag.y,0,maxY)+'px';studio.style.right='auto';});
        const endPdfDrag=e=>{if(!pdfDrag||e.pointerId!==pdfDrag.id)return;pdfDrag=null;};
        handle.addEventListener('pointerup',endPdfDrag);handle.addEventListener('pointercancel',endPdfDrag);window.addEventListener('resize',clampPdfStudio,{passive:true});

    </script>
