<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cuaderno Universitario - Rendimiento Máximo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
    <style>
        :root { --bg-color: #1e1e1e; --toolbar-bg: #121212; --text-color: #fff; --accent: #4caf50; --ui-border: rgba(255,255,255,0.1); }
        body { margin: 0; padding: 0; background-color: var(--bg-color); font-family: 'Segoe UI', Tahoma, sans-serif; color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; overscroll-behavior: none; }
        
        /* Barra de Herramientas */
        #toolbar { position: sticky; top: 0; width: 100%; background: var(--toolbar-bg); padding: 8px 12px; display: flex; gap: 8px; justify-content: flex-start; align-items: center; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.6); overflow-x: auto; scrollbar-width: none; }
        #toolbar::-webkit-scrollbar { display: none; }
        button, select, input[type="range"] { background: #2a2a2a; color: white; border: 1px solid #444; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; white-space: nowrap; outline: none; }
        button:hover, select:hover { background: #3a3a3a; border-color: var(--accent); }
        button.active { background: var(--accent); color: #000; font-weight: 700; border-color: var(--accent); }
        input[type="color"] { -webkit-appearance: none; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; background: transparent; padding: 0; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid #555; border-radius: 50%; }
        .tool-group { display: flex; align-items: center; gap: 6px; border-right: 1px solid #444; padding-right: 10px; flex-shrink: 0; }

        /* Contenedor del Cuaderno */
        #notebook { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 12px 80px; width: 96%; max-width: 1400px; }
        
        /* Estructura de la Hoja Optimizada */
        .page-container { position: relative; width: 100%; aspect-ratio: 1 / 1.414; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 6px; overflow: hidden; contain: strict; will-change: transform; transform: translateZ(0); }
        .bg-layer, .draw-layer, .line-preview-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: top left; }
        .bg-layer { z-index: 1; pointer-events: none; }
        .draw-layer { z-index: 2; cursor: crosshair; touch-action: none; } /* Touch-action none vital para evitar desvanecimientos táctiles */
        .line-preview-layer { z-index: 12; pointer-events: none; display: none; }

        /* Elementos Pegados (Imágenes / PDFs) */
        .pasted-element { position: absolute; z-index: 3; border: 2px dashed transparent; cursor: move; user-select: none; touch-action: none; will-change: left, top; }
        .pasted-element.active-element { box-shadow: 0 0 0 2px rgba(0,120,215,.3); border-color: #0078d7; }
        .pasted-image { display: block; width: 100%; height: 100%; pointer-events: none; }
        .resize-handle { position: absolute; bottom: -8px; right: -8px; width: 16px; height: 16px; background-color: #0078d7; border: 2px solid white; border-radius: 50%; cursor: nwse-resize; display: none; }
        .pasted-element.active-element .resize-handle { display: block; }
        
        /* Controles de Objeto Pegado */
        .object-tools { position: absolute; top: 5px; right: 5px; display: none; gap: 4px; z-index: 8; pointer-events: auto; }
        .pasted-element.active-element .object-tools { display: flex; }
        .object-tools button { border: 0; background: rgba(15,23,42,.9); color: #fff; border-radius: 6px; width: 28px; height: 28px; font-size: 14px; cursor: pointer; }
        .pasted-element.pdf-background { z-index: 1 !important; }
        .pasted-element.pdf-locked { cursor: default !important; }
        .pasted-element.pdf-background .resize-handle, .pasted-element.pdf-locked .resize-handle, .pasted-element.pdf-background .object-tools, .pasted-element.pdf-locked .object-tools { display: none !important; }

        /* UI Flotante */
        #pageIndicator { position: fixed; left: 16px; bottom: 16px; z-index: 450; background: rgba(15,15,15,.9); padding: 8px 12px; border-radius: 8px; font-size: 13px; border: 1px solid var(--ui-border); font-weight: bold; pointer-events: none; }
        #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 9999; background: #222; color: #fff; border: 1px solid #555; border-radius: 8px; padding: 10px 16px; font-size: 14px; pointer-events: none; transition: .2s ease-out; box-shadow: 0 8px 25px rgba(0,0,0,.5); }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Gestor de Materias */
        #nb-launcher { position: fixed; left: 16px; top: 70px; z-index: 5000; background: #1a202c; color: #fff; border: 1px solid #4a5568; border-radius: 8px; padding: 10px 14px; font-weight: bold; box-shadow: 0 6px 20px rgba(0,0,0,0.6); cursor: pointer; }
        #nb-drawer { position: fixed; inset: 0 auto 0 0; width: min(340px, 90vw); background: #1a202c; z-index: 5001; transform: translateX(-105%); transition: transform .3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 12px 0 40px rgba(0,0,0,0.7); display: flex; flex-direction: column; }
        #nb-drawer.open { transform: translateX(0); }
        .nb-head, .nb-actions { padding: 16px; border-bottom: 1px solid #2d3748; }
        .nb-head { display: flex; justify-content: space-between; align-items: center; }
        .nb-head h2 { margin: 0; font-size: 18px; }
        .nb-head button { background: transparent; border: none; font-size: 18px; }
        #nb-list { padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
        .nb-item { display: flex; align-items: center; background: #2d3748; border-radius: 8px; padding: 10px; border: 1px solid #4a5568; cursor: pointer; }
        .nb-item:hover { background: #3a4759; }
        .nb-item.active { border-color: #63b3ed; background: rgba(99,179,237,0.15); }
        .nb-name { font-weight: bold; flex: 1; }
        #nb-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 4998; backdrop-filter: blur(2px); }
        #nb-overlay.open { display: block; }

        /* PDF Studio */
        #pdfStudio { position: fixed; z-index: 4800; top: 70px; right: 16px; width: min(600px, calc(100vw - 32px)); height: min(65vh, 600px); background: #1e293b; border: 1px solid #334155; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); display: none; flex-direction: column; resize: both; overflow: hidden; }
        #pdfStudio.open { display: flex; }
        .pdf-head { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #0f172a; border-bottom: 1px solid #334155; cursor: move; user-select: none; }
        .pdf-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px; background: #1e293b; border-bottom: 1px solid #334155; }
        #pdfLibrary { display: flex; gap: 6px; padding: 10px; background: #0f172a; border-bottom: 1px solid #334155; overflow-x: auto; scrollbar-width: none; }
        .pdf-chip { border: 1px solid #475569; background: #1e293b; border-radius: 20px; padding: 6px 12px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .pdf-chip.active { border-color: #3b82f6; background: rgba(59,130,246,0.2); }
        .pdf-view { position: relative; flex: 1; overflow: auto; background: #334155; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .pdf-page-wrap { position: relative; background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,0.6); display: inline-block; }
        .pdf-crop-box { position: absolute; border: 2px dashed #22c55e; background: rgba(34,197,94,0.15); display: none; pointer-events: none; z-index: 4; }

        /* Fullscreen modifications */
        :fullscreen #toolbar { position: fixed; top: 0; left: 0; width: 100%; opacity: 0; transition: opacity 0.3s; z-index: 9000; }
        :fullscreen #toolbar:hover { opacity: 1; }
        :fullscreen #notebook { width: 100%; max-width: none; padding-top: 20px; }
        :fullscreen #nb-launcher { display: none; }
    </style>
</head>
<body>

    <!-- BARRA DE HERRAMIENTAS -->
    <div id="toolbar">
        <div class="tool-group" style="border-right:none;">
            <button onclick="togglePdfStudio()">📄 Recortar PDFs</button>
        </div>
        <div class="tool-group">
            <button id="btnPen" class="active" onclick="setTool('pen')">✒️ Lapicera</button>
            <button id="btnPencil" onclick="setTool('pencil')">✏️ Lápiz</button>
            <button id="btnLine" onclick="setTool('line')">📏 Línea recta</button>
            <button id="btnEraser" onclick="setTool('eraser')">🧼 Goma</button>
        </div>
        <div class="tool-group">
            <input type="color" id="colorPicker" value="#000000" onchange="updateColor()" title="Color del trazo">
            <label style="font-size:12px; margin-left:4px;">Grosor:</label>
            <input type="range" id="strokeSize" min="1" max="25" value="3" onchange="updateSize()" style="width: 80px;">
        </div>
        <div class="tool-group">
            <select id="bgType" onchange="changeBackgroundAll()">
                <option value="rayada">Hoja Rayada</option>
                <option value="cuadriculada">Hoja Cuadriculada</option>
                <option value="blanca">Hoja Blanca</option>
            </select>
        </div>
        <div class="tool-group">
            <button onclick="addPage()">➕ Nueva Hoja</button>
            <button onclick="duplicatePage()">📑 Duplicar</button>
            <button onclick="clearCurrentPage()" style="color:#ff6b6b;">🗑️ Limpiar</button>
            <button onclick="document.getElementById('anyFileInput').click()">📎 Insertar Imagen/Archivo</button>
            <input type="file" id="anyFileInput" style="display:none" multiple onchange="handleAnyFile(event)">
        </div>
        <div class="tool-group" style="border-right: none;">
            <button onclick="toggleFullScreen()">⛶ Pantalla Completa</button>
            <button onclick="descargarRespaldo()" style="background:#0f766e; border-color:#0d9488;">📥 Guardar Backup</button>
            <button onclick="cargarRespaldo()" style="background:#b45309; border-color:#d97706;">📤 Restaurar Backup</button>
        </div>
    </div>

    <div id="pageIndicator">Hoja 0 / 0</div>
    <div id="toast"></div>

    <div id="notebook">
        <!-- Las hojas se generan dinámicamente -->
    </div>

    <!-- GESTOR DE MATERIAS -->
    <button id="nb-launcher" onclick="toggleNotebookManager()">📚 Mis Cuadernos</button>
    <div id="nb-overlay" onclick="toggleNotebookManager()"></div>
    <aside id="nb-drawer">
      <div class="nb-head"><h2>📚 Mis Cuadernos</h2><button onclick="toggleNotebookManager()">✕</button></div>
      <div class="nb-actions" style="display:flex; gap:10px;">
          <button onclick="createNotebook()" style="flex:1;">➕ Nueva Materia</button>
          <button onclick="renameCurrentNotebook()" style="flex:1;">✏️ Renombrar</button>
      </div>
      <div id="nb-list"></div>
    </aside>

    <!-- PDF STUDIO -->
    <div id="pdfStudio">
      <div class="pdf-head" id="pdfDragHandle">
          <strong id="pdfTitle">📄 Lector y Recortes PDF</strong><span style="flex:1"></span>
          <button onclick="pdfZoom(-1)">−</button><span id="pdfZoomLabel" style="font-size:12px; margin:0 5px;">100%</span><button onclick="pdfZoom(1)">+</button>
          <button onclick="togglePdfStudio()" style="margin-left:10px; background:transparent; border:none; font-size:16px;">✕</button>
      </div>
      <div class="pdf-bar">
        <input id="pdfFileInput" type="file" accept="application/pdf" style="width:160px; font-size:11px;">
        <button onclick="pdfPrevPage()">◀</button><span id="pdfPageLabel" style="font-size:12px; font-weight:bold; margin:0 5px;">Sin PDF</span><button onclick="pdfNextPage()">▶</button>
        <button id="pdfCropBtn" onclick="togglePdfCrop()" style="margin-left:auto; background:#2563eb; border-color:#3b82f6;">✂️ Recortar Área</button>
        <button id="pdfPasteBtn" onclick="pastePdfCropToNotebook()" style="background:#059669; border-color:#10b981;">📋 Pegar en Hoja</button>
      </div>
      <div id="pdfLibrary"><div style="font-size:12px; color:#94a3b8;">Sube un PDF para verlo aquí.</div></div>
      <div id="pdfView" class="pdf-view"><div style="font-size:13px; color:#94a3b8;">Selecciona un PDF de la lista o carga uno nuevo.</div></div>
    </div>

    <!-- SCRIPT PRINCIPAL: MOTOR GRÁFICO OPTIMIZADO -->
    <script>
        // VARIABLES GLOBALES
        let currentTool = 'pen'; 
        let strokeColor = '#000000';
        let strokeSize = 3;
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let pagesData = []; 
        let activePageContainer = null; 
        let activePastedElement = null;
        let drawRectCache = null;
        const notebookEl = document.getElementById('notebook');

        // MULTIPLICADOR DE RESOLUCIÓN (Evita el desenfoque en pantallas modernas)
        const PIXEL_RATIO = window.devicePixelRatio || 2;

        // SISTEMA DE ALERTAS (TOAST)
        function toast(msg){
            const el = document.getElementById('toast'); if(!el) return;
            el.textContent = msg; el.classList.add('show');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
        }

        // PANTALLA COMPLETA
        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        // INICIO
        window.onload = () => { if (pagesData.length === 0) addPage(); };

        // CONFIGURACIÓN DE HERRAMIENTAS
        function setTool(tool) {
            currentTool = tool;
            ['btnPen','btnPencil','btnLine','btnEraser'].forEach(id => document.getElementById(id).classList.remove('active'));
            document.getElementById('btn' + tool.charAt(0).toUpperCase() + tool.slice(1)).classList.add('active');
        }
        function updateSize() { strokeSize = parseFloat(document.getElementById('strokeSize').value); }
        function updateColor() { strokeColor = document.getElementById('colorPicker').value; }

        // ================= GESTIÓN DE HOJAS =================
        function addPage(savedImgData = null, savedBg = null, savedElements = []) {
            const pageId = Date.now() + Math.random();
            const container = document.createElement('div');
            container.className = 'page-container';
            container.id = 'page-' + pageId;

            const bgCanvas = document.createElement('canvas'); bgCanvas.className = 'bg-layer';
            const drawCanvas = document.createElement('canvas'); drawCanvas.className = 'draw-layer';

            container.appendChild(bgCanvas); container.appendChild(drawCanvas);
            notebookEl.appendChild(container);

            container.addEventListener('pointerdown', () => { activePageContainer = container; updatePageIndicator(); });
            
            // Forzar configuración anti-fading en el contexto
            const drawCtx = drawCanvas.getContext('2d', { willReadFrequently: true });
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';

            const pageObj = {
                id: pageId, container, bgCanvas, drawCanvas, 
                bgCtx: bgCanvas.getContext('2d', { alpha: false }), drawCtx,
                _savedImgData: savedImgData || null, _dirtySave: !savedImgData, 
                linePreview: null, linePreviewCtx: null
            };
            
            pagesData.push(pageObj); 
            activePageContainer = container; 

            resizePageCanvases(pageObj);
            if (savedBg) document.getElementById('bgType').value = savedBg;
            drawBackground(pageObj);

            if (savedImgData) {
                const img = new Image();
                img.onload = () => {
                    pageObj.drawCtx.save(); 
                    pageObj.drawCtx.setTransform(1, 0, 0, 1, 0, 0); // Reset scale
                    pageObj.drawCtx.drawImage(img, 0, 0, pageObj.drawCanvas.width, pageObj.drawCanvas.height);
                    pageObj.drawCtx.restore();
                };
                img.src = savedImgData;
            }

            if (savedElements && savedElements.length > 0) {
                savedElements.forEach(elData => {
                    createPastedImage(elData.src, container, elData.x, elData.y, elData.w, elData.h, elData.locked, elData.background);
                });
            }
            setupDrawingEvents(pageObj); 
            updatePageIndicator();
        }

        // REDIMENSIÓN PERFECTA (Resolución Nativa y Anti-Clear)
        function resizePageCanvases(page) {
            const rect = page.container.getBoundingClientRect(); 
            
            // Guardar estado actual en memoria usando dibujado directo (Evita el lag del toDataURL)
            let tempCanvas = null;
            if (page.drawCanvas.width > 0) {
                tempCanvas = document.createElement('canvas');
                tempCanvas.width = page.drawCanvas.width;
                tempCanvas.height = page.drawCanvas.height;
                tempCanvas.getContext('2d').drawImage(page.drawCanvas, 0, 0);
            }

            // Aplicar Pixel Ratio
            page.bgCanvas.width = Math.round(rect.width * PIXEL_RATIO); 
            page.bgCanvas.height = Math.round(rect.height * PIXEL_RATIO);
            page.drawCanvas.width = Math.round(rect.width * PIXEL_RATIO); 
            page.drawCanvas.height = Math.round(rect.height * PIXEL_RATIO);
            
            // Escalar contexto para que las coordenadas CSS coincidan con los píxeles reales
            page.bgCtx.setTransform(PIXEL_RATIO, 0, 0, PIXEL_RATIO, 0, 0); 
            page.drawCtx.setTransform(PIXEL_RATIO, 0, 0, PIXEL_RATIO, 0, 0);

            // Restaurar configuración vital del lápiz
            page.drawCtx.lineCap = 'round';
            page.drawCtx.lineJoin = 'round';

            // Restaurar imagen anterior sin desvanecimientos
            if (tempCanvas) {
                page.drawCtx.save();
                page.drawCtx.setTransform(1, 0, 0, 1, 0, 0); // Dibujar 1:1 en píxeles reales
                page.drawCtx.drawImage(tempCanvas, 0, 0, page.drawCanvas.width, page.drawCanvas.height);
                page.drawCtx.restore();
            }
        }

        function changeBackgroundAll() { pagesData.forEach(page => drawBackground(page)); scheduleAutosave(); }
        
        function drawBackground(page) {
            const ctx = page.bgCtx; 
            const w = page.bgCanvas.width / PIXEL_RATIO; 
            const h = page.bgCanvas.height / PIXEL_RATIO;
            const type = document.getElementById('bgType').value;
            
            ctx.fillStyle = '#ffffff'; 
            ctx.fillRect(0, 0, w, h);
            
            if (type === 'rayada') {
                ctx.strokeStyle = '#8bc34a'; ctx.lineWidth = 1;
                for (let y = 50; y < h; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.4)'; ctx.beginPath(); ctx.moveTo(60, 0); ctx.lineTo(60, h); ctx.stroke();
            } else if (type === 'cuadriculada') {
                ctx.strokeStyle = 'rgba(0, 150, 255, 0.25)'; ctx.lineWidth = 1; const step = 20;
                for (let x = 0; x < w; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
                for (let y = 0; y < h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(step*3, 0); ctx.lineTo(step*3, h); ctx.stroke();
            }
        }

        function clearCurrentPage() {
            if(!activePageContainer) return;
            const page = pagesData.find(p => p.container === activePageContainer);
            if(page) {
                page.drawCtx.clearRect(0, 0, page.drawCanvas.width, page.drawCanvas.height);
                activePageContainer.querySelectorAll('.pasted-element').forEach(el => el.remove());
                page._dirtySave = true; scheduleAutosave(); toast('🧹 Hoja limpiada');
            }
        }
        function duplicatePage(){
            const p=pagesData.find(x=>x.container===activePageContainer)||pagesData[pagesData.length-1]; if(!p)return;
            const els=[...p.container.querySelectorAll('.pasted-element')].map(el=>({ src:el.querySelector('img')?.src, x:el.style.left, y:el.style.top, w:el.style.width, h:el.style.height, locked:el.classList.contains('pdf-locked'), background:el.classList.contains('pdf-background') }));
            addPage(p.drawCanvas.toDataURL(), document.getElementById('bgType').value, els); toast('📑 Hoja duplicada');
        }
        function updatePageIndicator(){
            const ind=document.getElementById('pageIndicator'); if(!ind)return;
            const idx=Math.max(0,pagesData.findIndex(p=>p.container===activePageContainer))+1;
            ind.textContent=`Hoja ${pagesData.length?idx:0} de ${pagesData.length}`;
        }

        // ================= MOTOR DE DIBUJO (ANTI-FADING) =================
        function setupDrawingEvents(page) {
            const canvas = page.drawCanvas;
            canvas.addEventListener('pointerdown', (e) => { try{canvas.setPointerCapture(e.pointerId)}catch(_){} startDrawing(e, page); }, {passive:false});
            canvas.addEventListener('pointermove', (e) => draw(e, page), {passive:false});
            window.addEventListener('pointerup', stopDrawing, {passive:true});
            window.addEventListener('pointercancel', stopDrawing, {passive:true});
        }
        function getMousePos(canvas, e) { const rect = drawRectCache || canvas.getBoundingClientRect(); return { x: e.clientX - rect.left, y: e.clientY - rect.top }; }
        
        function ensureLinePreview(page){
            if(page.linePreview) return page.linePreview;
            const c=document.createElement('canvas'); c.className='line-preview-layer'; 
            c.width=page.drawCanvas.width; c.height=page.drawCanvas.height;
            page.container.appendChild(c); page.linePreview=c; page.linePreviewCtx=c.getContext('2d'); return c;
        }

        function startDrawing(e, page) {
            if(e.target.tagName.toLowerCase() === 'canvas') deselectPastedElements();
            activePageContainer=page.container; isDrawing = true;
            drawRectCache = page.drawCanvas.getBoundingClientRect();
            const pos = getMousePos(page.drawCanvas, e); lastX = pos.x; lastY = pos.y;
            const ctx = page.drawCtx; 
            
            if (currentTool === 'line') {
                page.startX = pos.x; page.startY = pos.y;
                const preview=ensureLinePreview(page); preview.width=page.drawCanvas.width; preview.height=page.drawCanvas.height; preview.style.display='block';
                page.linePreviewCtx.setTransform(PIXEL_RATIO,0,0,PIXEL_RATIO,0,0); 
                page.linePreviewCtx.clearRect(0,0,page.drawCanvas.clientWidth,page.drawCanvas.clientHeight);
            } else {
                draw(e, page);
            }
        }

        function draw(e, page) {
            if (!isDrawing) return;
            e.preventDefault(); 
            const ctx = page.drawCtx; 
            const rect = drawRectCache;
            // Usar getCoalescedEvents para capturar cada micro-movimiento del lápiz
            const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; 

            if (currentTool === 'line') {
                const ev = events[events.length - 1]; const pos = { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
                const pctx=page.linePreviewCtx; pctx.setTransform(PIXEL_RATIO,0,0,PIXEL_RATIO,0,0); pctx.clearRect(0,0,page.drawCanvas.clientWidth,page.drawCanvas.clientHeight);
                pctx.globalCompositeOperation='source-over'; pctx.globalAlpha=1; pctx.strokeStyle=strokeColor; pctx.lineWidth=strokeSize; pctx.lineCap='round'; pctx.lineJoin='round';
                pctx.beginPath(); pctx.moveTo(page.startX,page.startY); pctx.lineTo(pos.x,pos.y); pctx.stroke(); return;
            }

            for (let i=0; i<events.length; i++) {
                const ev=events[i], pos={x:ev.clientX-rect.left, y:ev.clientY-rect.top}; 
                
                ctx.beginPath(); 
                ctx.moveTo(lastX, lastY); 
                ctx.lineTo(pos.x, pos.y);

                if(currentTool === 'eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineWidth = strokeSize * 8; // Goma generosa
                    ctx.strokeStyle = 'rgba(0,0,0,1)';
                    ctx.globalAlpha = 1;
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = strokeColor;
                    
                    if (currentTool === 'pen') {
                        // FIX DEFINITIVO ANTI-FADING (LAPICERA):
                        // 1. Ignorar la presión del dispositivo (para que los finales del trazo no desaparezcan).
                        // 2. Opacidad siempre al 100%.
                        ctx.globalAlpha = 1;
                        ctx.lineWidth = strokeSize; 
                    } else if (currentTool === 'pencil') {
                        // Lápiz: Mantiene comportamiento realista (presión suave + semi transparencia)
                        let pressure = ev.pressure || 1;
                        ctx.globalAlpha = 0.4;
                        ctx.lineWidth = strokeSize * Math.max(0.2, pressure); // Mínimo 20% grosor para no desaparecer
                    }
                }
                
                ctx.stroke(); 
                lastX = pos.x; lastY = pos.y;
            }
        }

        function stopDrawing(e) {
            if(!isDrawing) return;
            const page=pagesData.find(p=>p.container===activePageContainer);
            if(page && currentTool==='line' && drawRectCache){
                const ev=e||window.event;
                if(ev && typeof ev.clientX==='number'){
                    const pos={x:ev.clientX-drawRectCache.left,y:ev.clientY-drawRectCache.top}; 
                    page.drawCtx.save(); 
                    page.drawCtx.globalCompositeOperation='source-over'; page.drawCtx.globalAlpha=1; page.drawCtx.strokeStyle=strokeColor; page.drawCtx.lineWidth=strokeSize; page.drawCtx.lineCap='round'; page.drawCtx.lineJoin='round';
                    page.drawCtx.beginPath(); page.drawCtx.moveTo(page.startX,page.startY); page.drawCtx.lineTo(pos.x,pos.y); page.drawCtx.stroke(); 
                    page.drawCtx.restore();
                }
                if(page.linePreviewCtx) page.linePreviewCtx.clearRect(0,0,page.linePreview.width,page.linePreview.height); 
                if(page.linePreview) page.linePreview.style.display='none';
            }
            isDrawing=false; drawRectCache=null;
            if(page) page._dirtySave=true;
            scheduleAutosave();
        }

        // REDIMENSIÓN DE PANTALLA (Gatilla el re-dibujo sin perder calidad)
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                pagesData.forEach((page) => {
                    resizePageCanvases(page); 
                    drawBackground(page);
                });
            }, 100); // Pequeño debounce para no saturar
        });


        // ================= OBJETOS Y ARCHIVOS =================
        function markPastedElementChanged(wrapper){
            const page=pagesData.find(p=>p.container===wrapper.parentElement); if(page) page._dirtySave=true; scheduleAutosave();
        }

        function createPastedImage(src, container, x, y, w, h, locked=false, background=false) {
            const wrapper = document.createElement('div'); wrapper.className = 'pasted-element';
            if(locked) wrapper.classList.add('pdf-locked'); if(background) wrapper.classList.add('pdf-background');
            wrapper.style.left = typeof x === 'number' ? x + 'px' : x; wrapper.style.top = typeof y === 'number' ? y + 'px' : y;
            wrapper.style.width = typeof w === 'number' ? w + 'px' : w; if(h) wrapper.style.height = typeof h === 'number' ? h + 'px' : h;

            const img = document.createElement('img'); img.src = src; img.className = 'pasted-image';
            img.onload = () => { if(!h) wrapper.style.height = (parseInt(wrapper.style.width) * (img.naturalHeight / img.naturalWidth)) + 'px'; };

            const resizeHandle = document.createElement('div'); resizeHandle.className = 'resize-handle';
            const tools=document.createElement('div'); tools.className='object-tools';
            const lockBtn=document.createElement('button'); lockBtn.textContent='🔒'; 
            const bgBtn=document.createElement('button'); bgBtn.textContent='📌'; 
            tools.append(lockBtn,bgBtn);

            wrapper.appendChild(img); wrapper.appendChild(resizeHandle); wrapper.appendChild(tools); container.appendChild(wrapper);

            deselectPastedElements(); wrapper.classList.add('active-element'); activePastedElement = wrapper;

            lockBtn.onclick = e => { e.stopPropagation(); wrapper.classList.toggle('pdf-locked'); lockBtn.textContent=wrapper.classList.contains('pdf-locked')?'🔓':'🔒'; markPastedElementChanged(wrapper); };
            bgBtn.onclick = e => { e.stopPropagation(); wrapper.classList.toggle('pdf-background'); wrapper.classList.add('pdf-locked'); lockBtn.textContent='🔓'; markPastedElementChanged(wrapper); toast(wrapper.classList.contains('pdf-background') ? '📌 Fijado como fondo' : 'Liberado de fondo');};
            
            let isDragging = false, dragPointerId = null, grabOffsetX = 0, grabOffsetY = 0, pendingLeft = 0, pendingTop = 0, dragRaf = 0;
            const applyDrag = () => { if(isDragging) { wrapper.style.left = pendingLeft + 'px'; wrapper.style.top = pendingTop + 'px'; } dragRaf=0; };
            const finishDrag = (e) => { if(!isDragging || (dragPointerId !== null && e && e.pointerId !== dragPointerId)) return; isDragging = false; dragPointerId = null; if(dragRaf) cancelAnimationFrame(dragRaf); wrapper.style.transform = 'none'; wrapper.style.left = pendingLeft + 'px'; wrapper.style.top = pendingTop + 'px'; markPastedElementChanged(wrapper); };
            
            wrapper.addEventListener('pointerdown', (e) => {
                if(e.target === resizeHandle || wrapper.classList.contains('pdf-locked')) return; e.preventDefault(); e.stopPropagation();
                deselectPastedElements(); wrapper.classList.add('active-element'); activePastedElement = wrapper;
                isDragging = true; dragPointerId = e.pointerId;
                const parentRect = container.getBoundingClientRect(), rect = wrapper.getBoundingClientRect();
                grabOffsetX = e.clientX - rect.left; grabOffsetY = e.clientY - rect.top;
                pendingLeft = rect.left - parentRect.left; pendingTop = rect.top - parentRect.top;
                wrapper.style.transform = 'none'; wrapper.setPointerCapture?.(e.pointerId);
            });
            wrapper.addEventListener('pointermove', (e) => {
                if(!isDragging || e.pointerId !== dragPointerId) return; e.preventDefault();
                const parentRect = container.getBoundingClientRect();
                pendingLeft = (e.clientX - parentRect.left) - grabOffsetX; pendingTop = (e.clientY - parentRect.top) - grabOffsetY;
                if(!dragRaf) dragRaf = requestAnimationFrame(applyDrag);
            }, {passive:false});
            wrapper.addEventListener('pointerup', finishDrag); wrapper.addEventListener('pointercancel', finishDrag);

            let isResizing = false, startResX, startW, startH;
            resizeHandle.addEventListener('pointerdown', (e) => { e.stopPropagation(); isResizing = true; startResX = e.clientX; startW = wrapper.offsetWidth; startH = wrapper.offsetHeight; });
            window.addEventListener('pointermove', (e) => { if(!isResizing) return; const newWidth = startW + (e.clientX - startResX); if(newWidth > 50) { wrapper.style.width = newWidth + 'px'; wrapper.style.height = (newWidth * (startH / startW)) + 'px'; markPastedElementChanged(wrapper); } });
            window.addEventListener('pointerup', () => { isResizing = false; });
        }

        function deselectPastedElements() { document.querySelectorAll('.pasted-element').forEach(el => el.classList.remove('active-element')); activePastedElement = null; }
        
        // BORRAR CON TECLADO
        window.addEventListener('keydown', (e) => { if((e.key === 'Delete' || e.key === 'Backspace') && activePastedElement && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target?.tagName||'')) { activePastedElement.remove(); activePastedElement = null; scheduleAutosave(); } });

        // INSERTAR CUALQUIER ARCHIVO / IMAGEN
        async function handleAnyFile(e) {
            const files = e.target.files; if (!files || files.length === 0) return;
            for (let file of files) {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader(); reader.onload = (ev) => { let target = activePageContainer || pagesData[pagesData.length-1].container; createPastedImage(ev.target.result, target, 50, 50, 300, null); }; reader.readAsDataURL(file);
                } else if (file.type === 'application/pdf') {
                    if(typeof loadFile === 'function') { await loadFile(file); if(!document.getElementById('pdfStudio').classList.contains('open')) togglePdfStudio(); }
                } else {
                    toast('⚠️ Formato no soportado en esta versión ligera. Usa imágenes o PDF.');
                }
            } e.target.value = '';
        }


        // ================= GUARDADO Y MATERIAS (SIN LAG) =================
        const NB_KEY = 'cuadernosMaterias_pro';
        let currentId = null;
        function uid(){return 'nb_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)}
        function readStore(){try{return JSON.parse(localStorage.getItem(NB_KEY))||{current:null,items:[]}}catch(e){return {current:null,items:[]}}}
        function writeStore(x){localStorage.setItem(NB_KEY,JSON.stringify(x))}
        
        function snapshotNotebook(){ 
            return {bg:document.getElementById('bgType')?.value||'rayada', pages:pagesData.map(p=>{ 
                // Guardar como webp calidad 80% es mucho más rápido que PNG
                if(p._dirtySave || !p._savedImgData){ p._savedImgData=p.drawCanvas.toDataURL('image/webp',0.80); p._dirtySave=false; } 
                return {imgData:p._savedImgData,elements:[...p.container.querySelectorAll('.pasted-element')].map(el=>({ src:el.querySelector('img')?.src, x:el.style.left,y:el.style.top,w:el.style.width,h:el.style.height,locked:el.classList.contains('pdf-locked'),background:el.classList.contains('pdf-background') }))}; 
            })}; 
        }
        
        // El autoguardado ahora tiene un "debounce" largo para asegurar que NUNCA interrumpa mientras estás escribiendo.
        let saveTimer=0;
        function scheduleAutosave(){ 
            clearTimeout(saveTimer); 
            // Espera 2.5 segundos de inactividad antes de guardar
            saveTimer = setTimeout(() => { 
                if(window.requestIdleCallback) {
                    requestIdleCallback(() => flushNotebookNow());
                } else {
                    flushNotebookNow();
                }
            }, 2500); 
        }
        
        function flushNotebookNow(){
            if(!currentId)return false;
            try{ const st=readStore(), it=st.items.find(x=>x.id===currentId); if(!it)return false; Object.assign(it,snapshotNotebook()); st.current=currentId; writeStore(st); if(document.getElementById('nb-drawer')?.classList.contains('open')) renderList(); return true; }catch(err){return false;}
        }

        function loadNotebook(item){
            const st=readStore(); st.current=item.id; writeStore(st); currentId=item.id;
            notebookEl.innerHTML=''; pagesData=[]; activePageContainer=null; document.getElementById('bgType').value=item.bg||'rayada';
            const pages=item.pages?.length?item.pages:[{imgData:null,elements:[]}];
            pages.forEach(pg=>{ addPage(pg.imgData||null, item.bg||'rayada', pg.elements); });
            updatePageIndicator(); renderList(); toast('📖 '+item.name);
        }

        window.toggleNotebookManager=function(){document.getElementById('nb-drawer').classList.toggle('open');document.getElementById('nb-overlay').classList.toggle('open');renderList()}
        function renderList(){
            const out=document.getElementById('nb-list'), st=readStore();
            if(!st.items.length){out.innerHTML='<div style="text-align:center;color:#9ca3af;">No hay cuadernos.</div>';return}
            out.innerHTML=st.items.map(it=>`<div class="nb-item ${it.id===currentId?'active':''}" onclick="switchNotebook('${it.id}')"><span class="nb-name">📘 ${it.name}</span><span style="font-size:12px; color:#a0aec0;">${it.pages?it.pages.length:0} hojas</span></div>`).join('');
        }
        window.switchNotebook=function(id){ if(id===currentId){toggleNotebookManager();return} flushNotebookNow(); const st=readStore(), item=st.items.find(x=>x.id===id); if(item) loadNotebook(item); toggleNotebookManager(); }
        window.createNotebook=function(){ flushNotebookNow(); const name=prompt('Nombre de la materia / cuaderno:','Nueva Materia'); if(!name?.trim())return; const st=readStore(), item={id:uid(),name:name.trim(),bg:'rayada',pages:[]}; st.items.push(item); st.current=item.id; writeStore(st); currentId=item.id; loadNotebook(item); toggleNotebookManager(); }
        window.renameCurrentNotebook=function(){ const st=readStore(),it=st.items.find(x=>x.id===currentId);if(!it)return; const n=prompt('Nuevo nombre:',it.name);if(!n?.trim())return;it.name=n.trim();writeStore(st);renderList();toast('✏️ Nombre actualizado'); }
        
        window.addEventListener('load', () => { 
            setTimeout(() => {
                const st=readStore();
                if(!st.items.length){ const first={id:uid(),name:'General',bg:'rayada',pages:[]}; st.items=[first]; st.current=first.id; writeStore(st); currentId=first.id; addPage(); flushNotebookNow(); } 
                else { currentId=st.current||st.items[0].id; loadNotebook(st.items.find(x=>x.id===currentId)||st.items[0]); }
                renderList();
            }, 100); 
        });
        window.addEventListener('beforeunload',()=>flushNotebookNow());

        // BACKUPS JSON
        function descargarRespaldo() {
            flushNotebookNow();
            const data = { materias: localStorage.getItem(NB_KEY) };
            const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
            const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "Cuadernos_Backup_" + new Date().toISOString().split('T')[0] + ".json"; a.click(); URL.revokeObjectURL(a.href); toast('📥 Backup descargado');
        }
        function cargarRespaldo() {
            const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = function(evento) {
                    try { const datos = JSON.parse(evento.target.result); if (datos.materias) localStorage.setItem(NB_KEY, datos.materias); alert("¡Respaldo restaurado correctamente!"); location.reload(); } 
                    catch (err) { alert("Error: Archivo de backup no válido."); }
                }; reader.readAsText(file);
            }; input.click();
        }


        // ================= PDF STUDIO Y RECORTES =================
        const PDF_DB='cuadernoPDFs_pro', PDF_STORE='pdfs';
        let pdfDoc=null,pdfPage=1,pdfScale=1.2,pdfCrop=false,pdfCropRect=null,currentPdfId=null;
        
        function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(PDF_DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(PDF_STORE)){db.createObjectStore(PDF_STORE,{keyPath:'id'}).createIndex('notebook','notebook',{unique:false})}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
        async function dbPut(v){const db=await openDB();return new Promise((res)=>{const tx=db.transaction(PDF_STORE,'readwrite');tx.objectStore(PDF_STORE).put(v);tx.oncomplete=res;})}
        async function dbGet(id){const db=await openDB();return new Promise((res)=>{const r=db.transaction(PDF_STORE).objectStore(PDF_STORE).get(id);r.onsuccess=()=>res(r.result);})}
        async function dbList(nb){const db=await openDB();return new Promise((res)=>{const r=db.transaction(PDF_STORE).objectStore(PDF_STORE).index('notebook').getAll(nb);r.onsuccess=()=>res(r.result||[]);})}
        
        window.togglePdfStudio = async function(){ const el=document.getElementById('pdfStudio'); el.classList.toggle('open'); if(el.classList.contains('open')) await refreshPdfLibrary(); };
        window.pdfZoom = function(d){ pdfScale=Math.max(.65,Math.min(3.0,pdfScale+d*.2)); document.getElementById('pdfZoomLabel').textContent=Math.round(pdfScale*100)+'%'; if(pdfDoc)renderPdfPage(pdfPage); };
        
        async function renderPdfPage(n){
            if(!pdfDoc)return; pdfPage=Math.max(1,Math.min(pdfDoc.numPages,n));
            const page=await pdfDoc.getPage(pdfPage); const vp=page.getViewport({scale:pdfScale});
            const view=document.getElementById('pdfView'); view.innerHTML='';
            const wrap=document.createElement('div'); wrap.className='pdf-page-wrap'; wrap.style.width=vp.width+'px'; wrap.style.height=vp.height+'px'; wrap.style.touchAction='none';
            const canvas=document.createElement('canvas'); canvas.width=Math.ceil(vp.width); canvas.height=Math.ceil(vp.height); canvas.style.width=vp.width+'px'; canvas.style.height=vp.height+'px';
            wrap.appendChild(canvas); const crop=document.createElement('div'); crop.className='pdf-crop-box'; wrap.appendChild(crop); view.appendChild(wrap);
            await page.render({canvasContext:canvas.getContext('2d',{alpha:false}),viewport:vp}).promise;
            pdfCropRect=null; crop.style.display='none'; document.getElementById('pdfPageLabel').textContent='Pág '+pdfPage+' / '+pdfDoc.numPages;

            let start=null;
            wrap.onpointerdown=e=>{ if(!pdfCrop)return; e.preventDefault(); const r=wrap.getBoundingClientRect(); start={x:Math.max(0,Math.min(r.width,e.clientX-r.left)),y:Math.max(0,Math.min(r.height,e.clientY-r.top))}; wrap.setPointerCapture?.(e.pointerId); pdfCropRect={x:start.x,y:start.y,w:0,h:0}; crop.style.display='block'; crop.style.left=start.x+'px'; crop.style.top=start.y+'px'; crop.style.width='0px'; crop.style.height='0px'; };
            wrap.onpointermove=e=>{ if(!pdfCrop||!start)return; const r=wrap.getBoundingClientRect(); const ex=Math.max(0,Math.min(r.width,e.clientX-r.left)), ey=Math.max(0,Math.min(r.height,e.clientY-r.top)); const x=Math.min(start.x,ex),y=Math.min(start.y,ey),w=Math.abs(ex-start.x),h=Math.abs(ey-start.y); pdfCropRect={x,y,w,h}; crop.style.left=x+'px';crop.style.top=y+'px';crop.style.width=w+'px';crop.style.height=h+'px'; };
            const finish=e=>{if(!start)return;wrap.releasePointerCapture?.(e.pointerId);start=null;if(pdfCropRect&&pdfCropRect.w>15)toast('✂️ Área seleccionada. Toca "Pegar en Hoja"');else{pdfCropRect=null;crop.style.display='none';}};
            wrap.onpointerup=finish; wrap.onpointercancel=finish;
        }

        async function openPdfRecord(rec){
            try{ const bytes=rec.bytes instanceof ArrayBuffer?rec.bytes:new Uint8Array(rec.bytes); pdfDoc=await window.__pdfjs.getDocument({data:bytes}).promise; currentPdfId=rec.id; pdfPage=1; await renderPdfPage(1); document.getElementById('pdfPageLabel').textContent=rec.name+' - Pág 1'; refreshPdfLibrary(); } catch(e){ toast('Error al abrir PDF'); }
        }
        async function refreshPdfLibrary(){
            if(!currentId) return; const list=await dbList(currentId); const lib=document.getElementById('pdfLibrary');
            lib.innerHTML=list.length?list.map(x=>`<button class="pdf-chip ${x.id===currentPdfId?'active':''}" onclick="loadLibraryPdf('${x.id}')">📄 ${x.name}</button>`).join(''):'<div style="color:#94a3b8;font-size:12px;">Sube un PDF para verlo aquí.</div>';
        }
        window.loadLibraryPdf = async (id) => { const rec=await dbGet(id); if(rec) await openPdfRecord(rec); };
        window.loadFile = async (f) => { if(!currentId)return; const bytes=await f.arrayBuffer(); const rec={id:'pdf_'+Date.now(),notebook:currentId,name:f.name,bytes}; await dbPut(rec); await openPdfRecord(rec); toast('📄 PDF guardado'); };
        
        document.getElementById('pdfFileInput').addEventListener('change', async e=>{ for(const f of e.target.files) if(f.type==='application/pdf') await window.loadFile(f); e.target.value=''; });
        window.pdfPrevPage=()=>pdfDoc&&renderPdfPage(pdfPage-1); window.pdfNextPage=()=>pdfDoc&&renderPdfPage(pdfPage+1);
        
        window.togglePdfCrop=function(){
            if(!pdfDoc){toast('Abrí un PDF primero');return} pdfCrop=!pdfCrop; pdfCropRect=null;
            document.getElementById('pdfCropBtn').textContent=pdfCrop?'✖️ Cancelar Selección':'✂️ Recortar Área';
            document.getElementById('pdfCropBtn').style.background=pdfCrop?'#ef4444':'#2563eb';
            if(!pdfCrop){const c=document.getElementById('pdfView').querySelector('.pdf-crop-box');if(c)c.style.display='none'}
        };
        
        window.pastePdfCropToNotebook=function(){
            if(!pdfDoc||!pdfCropRect||pdfCropRect.w<8){toast('⚠️ Selecciona un área del PDF primero arrastrando el mouse');return}
            const wrap=document.getElementById('pdfView').querySelector('.pdf-page-wrap'),canvas=wrap?.querySelector('canvas'); if(!wrap||!canvas)return;
            const sx=canvas.width/wrap.getBoundingClientRect().width,sy=canvas.height/wrap.getBoundingClientRect().height;
            const sx0=Math.floor(pdfCropRect.x*sx),sy0=Math.floor(pdfCropRect.y*sy),sw=Math.ceil(pdfCropRect.w*sx),sh=Math.ceil(pdfCropRect.h*sy);
            
            const out=document.createElement('canvas');out.width=sw;out.height=sh;
            out.getContext('2d').drawImage(canvas,sx0,sy0,sw,sh,0,0,sw,sh);
            const src=out.toDataURL('image/png');
            
            let target = activePageContainer || pagesData[pagesData.length-1].container;
            // Pegarlo centrado arriba
            createPastedImage(src, target, 50, 50, Math.min(target.clientWidth-80, sw));
            
            pdfCrop=false; 
            document.getElementById('pdfCropBtn').textContent='✂️ Recortar Área'; 
            document.getElementById('pdfCropBtn').style.background='#2563eb';
            wrap.querySelector('.pdf-crop-box').style.display='none'; 
            toast('📋 Recorte pegado en la hoja activa');
        };

        // Arrastre simple de la ventana del PDF
        const studio=document.getElementById('pdfStudio'), handle=document.getElementById('pdfDragHandle'); let pdfDrag=null;
        handle.addEventListener('pointerdown', e => { if(e.target.closest('button'))return; const r=studio.getBoundingClientRect(); pdfDrag={x:e.clientX-r.left,y:e.clientY-r.top}; handle.setPointerCapture?.(e.pointerId); });
        handle.addEventListener('pointermove', e => { if(!pdfDrag)return; studio.style.left=Math.max(0,e.clientX-pdfDrag.x)+'px'; studio.style.top=Math.max(0,e.clientY-pdfDrag.y)+'px'; studio.style.right='auto'; });
        handle.addEventListener('pointerup', () => pdfDrag=null);
        
        // Inicializar PDF.js worker
        import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs').then(mod=>{ window.__pdfjs=mod; mod.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs'; }).catch(() => toast("Cargando motor de PDF..."));
    </script>
</body>
</html>
